name: Packer Static Analysis

on:
  pull_request:
    paths:
      - "packer/**"
      - ".github/workflows/packer-lint.yml"
      - "src/main/kotlin/com/rustyrazorblade/easydblab/containers/Packer.kt"
  push:
    branches:
      - main
    paths:
      - "packer/**"
      - ".github/workflows/packer-lint.yml"
      - "src/main/kotlin/com/rustyrazorblade/easydblab/containers/Packer.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packer:
    name: Validate Packer HCL Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "latest"

      - name: Initialize Packer
        run: |
          cd packer/base
          packer init .
          cd ../cassandra
          packer init .

      # Packer validates a builder's private key file, so give it one.
      - name: Create a throwaway SSH key
        run: ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/secret.pem"

      # Every -var Packer.buildCommand passes (PackerBuildCommandTest checks this list against it),
      # with an ssm build's ssh_interface and a release version, so an undeclared or mistyped
      # variable fails here.
      - name: Validate base.pkr.hcl and cassandra.pkr.hcl
        run: |
          for template in base/base.pkr.hcl cassandra/cassandra.pkr.hcl; do
            (cd "packer/$(dirname "$template")" && packer validate \
              -var region=us-west-2 \
              -var arch=amd64 \
              -var s3_bucket=validate-bucket \
              -var ssh_keypair_name=validate-key \
              -var "ssh_private_key_file=$RUNNER_TEMP/secret.pem" \
              -var ssh_interface=session_manager \
              -var ssh_keep_alive_interval=10s \
              -var ssh_read_write_timeout=2m \
              -var release_version=1 \
              -var 'marker_tags={"easy_cass_lab" = "1", "easy_db_lab" = "1", "easy_db_lab_build_id" = "validate"}' \
              "$(basename "$template")")
          done

  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./packer"
          severity: error
          format: gcc

  yamllint:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          # Check if .yamllint.yml exists, use it; otherwise use default config
          if [ -f packer/.yamllint.yml ]; then
            yamllint -c packer/.yamllint.yml packer/
          else
            yamllint packer/
          fi
