name: Packer Script Testing

on:
  pull_request:
    paths:
      - 'packer/**'
      - '.github/cassandra-image/**'
      - '.github/workflows/packer-test.yml'
  push:
    branches:
      - main
    paths:
      - 'packer/**'
      - '.github/cassandra-image/**'
      - '.github/workflows/packer-test.yml'
  workflow_dispatch:

jobs:
  test-cassandra-build-plan:
    name: Test build-cassandra-ref build-plan logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run build-plan unit tests
        run: bash .github/cassandra-image/resolve-build-plan.test.sh

      - name: Run ref-resolution unit tests
        run: bash .github/cassandra-image/resolve-ref.test.sh

  test-cassandra-install-scripts:
    name: Test Cassandra install/use script logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Not `snap install yq`: the snap is strictly confined and gets a private /tmp, so it
      # cannot read the mktemp -d fixtures these tests build. Pinned to the version the AMI
      # bakes (packer/base/install/install_yq.sh) so CI exercises the same yq the nodes run.
      - name: Install yq
        run: |
          curl -fsSL --retry 3 \
            https://github.com/mikefarah/yq/releases/download/v4.41.1/yq_linux_amd64 -o /tmp/yq
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Test install-cassandra-version
        run: bash packer/cassandra/bin/install-cassandra-version.test.sh

      - name: Test the bake-time install loop
        run: bash packer/cassandra/install/install_cassandra.test.sh

      - name: Test use-cassandra
        run: bash packer/cassandra/bin/use-cassandra.test.sh

  test-profiling-reconciler:
    name: Test edl-profiling-reconcile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The reconciler parses JSON with mikefarah's Go yq, which is what the node AMI carries. The
      # python `yq` wrapper answers to the same name and takes different flags, so the version is
      # pinned and verified rather than assumed — a wrong yq would fail every test for a reason
      # that has nothing to do with the change under test.
      - name: Install mikefarah yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify node tooling
        run: |
          yq --version
          yq --version | grep -q 'mikefarah' || {
            echo "yq on PATH is not mikefarah's Go implementation; the reconciler needs that one."
            exit 1
          }
          jq --version

      # The reconciler stubs asprof, cassandra-pid and curl and injects the clock, so this is a
      # pure-bash tier: no Docker, no network, no JVM. It is wired here rather than left as a
      # `gradle check` dependency because no workflow runs `check` — pr-checks.yml runs
      # `test integrationTest koverXmlReport` — so the whole decision table had no CI gate at all.
      - name: Run reconciler unit tests
        run: bash packer/cassandra/bin/edl-profiling-reconcile.test.sh

  test-individual-scripts:
    name: Test Individual Scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - cassandra/install/install_cassandra_easy_stress.sh
          - base/install/install_python.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        run: |
          cd packer
          docker build -t easy-db-lab-packer-test .

      - name: Test script - ${{ matrix.script }}
        run: |
          cd packer
          ./test-script.sh ${{ matrix.script }}

  test-changed-scripts:
    name: Test Changed Scripts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        run: |
          cd packer
          docker build -t easy-db-lab-packer-test .

      - name: Detect and test changed scripts
        run: |
          cd packer
          echo "Detecting changed shell scripts..."

          # Get list of changed .sh files
          CHANGED_SCRIPTS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^packer/.*\.sh$' | grep -v 'test-script.sh' || true)

          if [ -z "$CHANGED_SCRIPTS" ]; then
            echo "No shell scripts changed in this PR"
            exit 0
          fi

          echo "Changed scripts:"
          echo "$CHANGED_SCRIPTS"

          # Test each changed script
          EXIT_CODE=0
          for script in $CHANGED_SCRIPTS; do
            # Remove 'packer/' prefix if present
            script_path="${script#packer/}"

            # Skip deleted files
            if [ ! -f "$script" ]; then
              echo "⊘ $script_path was deleted, skipping test"
              continue
            fi

            echo "Testing: $script_path"

            if ./test-script.sh "$script_path"; then
              echo "✓ $script_path passed"
            else
              echo "✗ $script_path failed"
              EXIT_CODE=1
            fi
          done

          exit $EXIT_CODE

  test-base-provisioning:
    name: Test Base Provisioning Sequence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test base provisioning
        run: |
          cd packer
          docker compose up --exit-code-from test-base test-base

      - name: Show logs on failure
        if: failure()
        run: |
          cd packer
          docker compose logs test-base

  test-cassandra-provisioning:
    name: Test Cassandra Provisioning Sequence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test cassandra provisioning
        run: |
          cd packer
          docker compose up --exit-code-from test-cassandra test-cassandra

      - name: Show logs on failure
        if: failure()
        run: |
          cd packer
          docker compose logs test-cassandra
