name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Decides whether test, quality and openspec run.  Classic branch protection
  # on main lists test and quality as required checks, so the workflow itself always runs: a job
  # that `if` skips reports "skipped", which a required check accepts, while a
  # workflow that paths-ignore skips reports nothing and blocks the merge.
  #
  # The gate fails closed: if this job fails, or the diff cannot be read,
  # test, quality and openspec run.  A cancelled run stops.
  #
  # A PR that changes only the docs-only paths below gets code=false.  Nothing
  # in the build or the tests reads them.  docs/, test-plans/, .claude/ and the
  # root CLAUDE.md are NOT docs-only: NoVictoriaReferencesTest and
  # KitFlagsDocumentedTest read them.  Keep this list in step with
  # WORKFLOW.md, "Docs-only PRs".  Pushes to main always run in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "openspec=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both paths of a move, so a file moved out of
          # src/ into openspec/ still counts as a code change.
          if ! changed=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA"); then
            echo "Cannot read the PR diff; running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "openspec=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          code=$(echo "$changed" | grep -Ev '^(openspec/.*|WORKFLOW\.md|README\.md|CONTRIBUTING\.md|DEVELOPERS\.md|CODE_OF_CONDUCT\.md|SECURITY\.md|history\.md)$' | grep -c . || true)
          spec=$(echo "$changed" | grep -c '^openspec/' || true)
          [ "$code" -gt 0 ] && echo "code=true" >> "$GITHUB_OUTPUT" || echo "code=false" >> "$GITHUB_OUTPUT"
          [ "$spec" -gt 0 ] && echo "openspec=true" >> "$GITHUB_OUTPUT" || echo "openspec=false" >> "$GITHUB_OUTPUT"

  # Validates every spec and change when a PR touches openspec/.  It needs no
  # JDK or Gradle, so a docs-only spec PR still gets a real check.
  openspec:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.openspec == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate specs
        run: |
          npm install -g @fission-ai/openspec@1.4.0
          openspec validate --all --no-interactive

  # Run tests without waiting for linting - fast feedback
  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The shell-script tests (`testScripts`) parse YAML/JSON with mikefarah's Go yq, which is
      # what the node AMI carries. The python `yq` wrapper answers to the same name and takes
      # different flags, so the version is pinned and verified rather than assumed. The AMI's own
      # installer does the install, so CI runs the yq version the nodes run
      # (packer/base/install/install_yq.sh is the only place that version is written down).
      - name: Install mikefarah yq
        run: |
          ARCH=amd64 EDL_CACHE_LIB=packer/base/install/edl-cache-lib.sh bash packer/base/install/install_yq.sh
          yq --version | grep -q 'mikefarah' || {
            echo "yq on PATH is not mikefarah's Go implementation; the script tests need that one."
            exit 1
          }

      # Every K3s container's kubelet, containerd and cAdvisor take inotify instances from the
      # runner's root user, which all containers share (no user namespaces). With two test forks
      # each running K3s, the runner's default ran out and a starting kubelet failed with
      # "inotify_init: too many open files", so K3s never logged node sync. These are the values
      # the cluster nodes get (commands/node-tuning/60-easydblab.conf).
      - name: Raise inotify limits for K3s containers
        run: |
          echo "before: max_user_instances=$(cat /proc/sys/fs/inotify/max_user_instances) max_user_watches=$(cat /proc/sys/fs/inotify/max_user_watches)"
          sudo sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576

      # Run BOTH test tiers: the fast unit tier (`test`) and the slow integration tier
      # (`integrationTest`, TestContainers/mock-server/real-I-O). GitHub's ubuntu runners ship
      # a running Docker daemon at /var/run/docker.sock, which the integration tier needs.
      # `testScripts` is every Docker-free shell-script test `check` depends on; no workflow runs
      # `check`, so without it here those scripts had no CI gate.
      - name: Run unit + integration tiers + script tests
        run: ./gradlew test integrationTest testScripts koverXmlReport --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/reports/tests/test/
            **/build/reports/tests/integrationTest/
            **/build/test-results/test/
            **/build/test-results/integrationTest/
            **/build/test-results/scripts/
          retention-days: 30

      # On any test failure, write the failing test ids (one `com.example.FooTest.method`
      # per line, across BOTH tiers) and upload them as the `spec-flow-failures` artifact,
      # so an agent can list the failures with `gh run download` (see WORKFLOW.md).
      # Script tests (`testScripts`) are Exec tasks; build.gradle.kts has each one write a
      # one-testcase report to build/test-results/scripts/, so a failing script shows up here as
      # `scripts.<gradle task>`.
      - name: Collect failing test ids
        if: failure()
        run: |
          python3 - <<'PY' > spec-flow-failures.txt
          import glob, xml.etree.ElementTree as ET
          ids = set()
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  if any(c.tag in ("failure", "error") for c in tc):
                      cls, name = tc.get("classname", ""), tc.get("name", "")
                      if cls and name:
                          ids.add(f"{cls}.{name}")
          print("\n".join(sorted(ids)))
          PY

      - name: Upload failing test ids
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spec-flow-failures
          path: spec-flow-failures.txt
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: '**/build/test-results/*/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Kover coverage report
        uses: mi-kas/kover-report@v2
        if: always()
        with:
          path: build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build/reports/kover/
            **/build/reports/jacoco/
          retention-days: 30

  # Run linting and static analysis in parallel with tests
  quality:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: |
            build/reports/detekt/
          retention-days: 30
