name: Publish Container

on:
  push:
    tags:
      - 'v*'
  # Run by hand by a maintainer, to publish the Pyroscope agent image from a branch before it
  # reaches main. Only publish-pyroscope-agent and publish-cassandra-runtime run on it.
  workflow_dispatch:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if PR Checks succeeded or this is a tag push
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "image_tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "first_tag=$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_BRANCH" == "main" ]]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "first_tag=latest" >> "$GITHUB_OUTPUT"
          else
            BRANCH="$HEAD_BRANCH"
            TAG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-128)
            echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "first_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push container
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
        run: |
          ./gradlew jib --no-daemon \
            -Djib.to.image.tag="$IMAGE_TAG" \
            ${TAGS:+-Djib.to.tags="$TAGS"}

      - name: Test container
        env:
          FIRST_TAG: ${{ steps.tags.outputs.first_tag }}
        run: |
          docker pull "ghcr.io/rustyrazorblade/easy-db-lab:$FIRST_TAG"
          docker run --rm "ghcr.io/rustyrazorblade/easy-db-lab:$FIRST_TAG" --help

      - name: Scan container image
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/rustyrazorblade/easy-db-lab:${{ steps.tags.outputs.first_tag }}
          fail-build: false
          severity-cutoff: high

  # The Pyroscope Java agent image kit and stress pods copy their agent jar from
  # (Constants.Kit.Agents.PYROSCOPE_IMAGE). Its tag is the agent version and its content is fixed by
  # the Dockerfile's checksum and pinned base images. It is published only from trusted refs (a tag
  # push, PR Checks passing on a push to main, or a maintainer's manual dispatch of a branch; never
  # a pull request's own run), and a version that is already published is never overwritten.
  publish-pyroscope-agent:
    runs-on: ubuntu-latest
    # The push trigger fires only for v* tags (see on.push), so no branch push reaches this job;
    # branches arrive only through workflow_run, which is limited to PR Checks on a push to main.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    # One publish at a time, whatever triggered it: the tag is read from the Dockerfile after
    # checkout, so the group cannot be keyed by it. A run that waits here then finds the tag a
    # finished run published and skips it, instead of racing it between the inspect and the push.
    # Never cancelled, so a run in the middle of a push always completes.
    concurrency:
      group: publish-pyroscope-agent
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # image-published.sh matches this release's "ERROR: <image>: not found" wording. An
          # upgrade that changes that wording makes the guard fail the job instead of pushing
          # (the safe direction): update the match in image-published.sh along with this pin.
          version: v0.38.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the agent version
        id: version
        run: |
          DOCKERFILE=docker/pyroscope-java-agent/Dockerfile
          VERSION=$(sed -n 's/^ARG PYROSCOPE_VERSION=//p' "$DOCKERFILE")
          SHA256=$(sed -n 's/^ARG PYROSCOPE_SHA256=//p' "$DOCKERFILE")
          # An edited ARG line must stop the publish, never push to an empty tag or build an
          # unverified jar.
          [ -n "$VERSION" ] || { echo "No 'ARG PYROSCOPE_VERSION=<version>' line in $DOCKERFILE" >&2; exit 1; }
          [ -n "$SHA256" ] || { echo "No 'ARG PYROSCOPE_SHA256=<sha256>' line in $DOCKERFILE" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already published
        id: published
        # Skips only a tag that inspects, pushes only on the registry's "not found", and fails the
        # job on any other inspect error (tested by ./gradlew testPyroscopeAgentPublished).
        env:
          IMAGE: ghcr.io/rustyrazorblade/pyroscope-java-agent:${{ steps.version.outputs.version }}
        run: bash .github/pyroscope-agent/image-published.sh

      - name: Build and push the multi-arch agent image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/pyroscope-java-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rustyrazorblade/pyroscope-java-agent:${{ steps.version.outputs.version }}

  # The JRE image the cassandra-pods kit runs a Cassandra tarball on
  # (Constants.Kit.CassandraPods.RUNTIME_IMAGE_REPOSITORY), one tag per JDK, as
  # <revision>-jre<N>. The revision is read from the Dockerfile and bumped with
  # Constants.Kit.CassandraPods.RUNTIME_IMAGE_REVISION (CassandraRuntimeImageTest). Published from
  # the same trusted refs as the Pyroscope agent; a published tag is never overwritten, and a tag
  # missing linux/amd64 or linux/arm64 fails the job.
  publish-cassandra-runtime:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17", "21"]
    concurrency:
      group: publish-cassandra-runtime-${{ matrix.java }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # image-published.sh matches this release's "not found" wording; see publish-pyroscope-agent.
          version: v0.38.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the runtime revision
        id: tag
        env:
          JAVA: ${{ matrix.java }}
        run: |
          DOCKERFILE=docker/cassandra-runtime/Dockerfile
          REVISION=$(sed -n 's/^ARG RUNTIME_REVISION=//p' "$DOCKERFILE")
          [ -n "$REVISION" ] || { echo "No 'ARG RUNTIME_REVISION=<n>' line in $DOCKERFILE" >&2; exit 1; }
          echo "image=ghcr.io/rustyrazorblade/cassandra-runtime:${REVISION}-jre${JAVA}" >> "$GITHUB_OUTPUT"

      - name: Skip a tag that is already published
        id: published
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: bash .github/pyroscope-agent/image-published.sh

      - name: Build and push the multi-arch runtime image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/cassandra-runtime
          platforms: linux/amd64,linux/arm64
          build-args: JAVA=${{ matrix.java }}
          push: true
          tags: ${{ steps.tag.outputs.image }}

      - name: Check both platforms are published
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: bash .github/cassandra-runtime/platforms-present.sh
