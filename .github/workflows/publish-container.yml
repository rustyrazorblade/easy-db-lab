name: Publish Container

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if PR Checks succeeded or this is a tag push
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "tags=v$VERSION" >> $GITHUB_OUTPUT
            echo "first_tag=$VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "first_tag=latest" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            TAG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-128)
            echo "image_tag=$TAG" >> $GITHUB_OUTPUT
            echo "first_tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build and push container
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS="${{ steps.tags.outputs.tags }}"
          ./gradlew jib --no-daemon \
            -Djib.to.image.tag=${{ steps.tags.outputs.image_tag }} \
            ${TAGS:+-Djib.to.tags=$TAGS}

      - name: Test container
        run: |
          FIRST_TAG=${{ steps.tags.outputs.first_tag }}
          docker pull ghcr.io/rustyrazorblade/easy-db-lab:$FIRST_TAG
          docker run --rm ghcr.io/rustyrazorblade/easy-db-lab:$FIRST_TAG --help

      - name: Scan container image
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/rustyrazorblade/easy-db-lab:${{ steps.tags.outputs.first_tag }}
          fail-build: false
          severity-cutoff: high

  # The Pyroscope Java agent image kit and stress pods copy their agent jar from
  # (Constants.Kit.Agents.PYROSCOPE_IMAGE). Its tag is the agent version and its content is fixed by
  # the Dockerfile's checksum and pinned base images. It is published only from trusted refs (a tag
  # push, or PR Checks passing on a push to main, never a pull request's branch), and a version that
  # is already published is never overwritten.
  publish-pyroscope-agent:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the agent version
        id: version
        run: |
          VERSION=$(sed -n 's/^ARG PYROSCOPE_VERSION=//p' docker/pyroscope-java-agent/Dockerfile)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already published
        id: published
        run: |
          IMAGE="ghcr.io/rustyrazorblade/pyroscope-java-agent:${{ steps.version.outputs.version }}"
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already published; not overwriting it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the multi-arch agent image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/pyroscope-java-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rustyrazorblade/pyroscope-java-agent:${{ steps.version.outputs.version }}
