# A stand-in for the signing proxy in DocumentsWebServerIntegrationTest: it answers every request
# with the method and the full request URI it received, so the test sees exactly what the documents
# web server forwarded.
worker_processes 1;
pid /tmp/stub.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/stub_client;
    proxy_temp_path /tmp/stub_proxy;
    fastcgi_temp_path /tmp/stub_fastcgi;
    uwsgi_temp_path /tmp/stub_uwsgi;
    scgi_temp_path /tmp/stub_scgi;

    server {
        listen 3081;

        location / {
            return 200 "upstream saw $request_method $request_uri\n";
        }
    }
}
