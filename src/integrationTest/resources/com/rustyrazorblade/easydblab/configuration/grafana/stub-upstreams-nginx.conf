# Stand-ins for the two upstreams of the Grafana front in GrafanaFrontIntegrationTest: the signing
# proxy on its loopback port and Grafana on its internal port. Each answers every request with what it
# received, so the test sees exactly what the front forwarded and to which upstream.
worker_processes 1;
pid /tmp/stub.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 0;
    client_body_temp_path /tmp/stub_client;
    proxy_temp_path /tmp/stub_proxy;
    fastcgi_temp_path /tmp/stub_fastcgi;
    uwsgi_temp_path /tmp/stub_uwsgi;
    scgi_temp_path /tmp/stub_scgi;

    # The signing proxy.
    server {
        listen __PROXY_PORT__;

        location / {
            return 200 "upstream saw $request_method $request_uri\n";
        }
    }

    # Grafana.
    server {
        listen __GRAFANA_INTERNAL_PORT__;

        location / {
            return 200 "grafana saw $request_method $request_uri host=$http_host upgrade=$http_upgrade connection=$http_connection length=$content_length\n";
        }
    }
}
