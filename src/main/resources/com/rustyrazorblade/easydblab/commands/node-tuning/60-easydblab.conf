# easy-db-lab node tuning: kernel settings every node runs with, so a database under test
# behaves as it does on a production host. Installed to /etc/sysctl.d/ by setup_instance.sh and
# applied at every boot by systemd-sysctl. `edl-node-tuning verify` reads each key back.
#
# Not set here, on purpose:
# - fs.nr_open and fs.file-max: systemd raises both far above 1048576 at boot; verify checks
#   they are at least 1048576 instead of writing a lower value.
# - rp_filter, ip_forward and the other keys Cilium owns (it writes 99-zzz-override_cilium.conf).
# - nf_conntrack_*: kube-proxy sizes connection tracking itself.
# - kernel.panic*, vm.overcommit_memory, vm.panic_on_oom: the kubelet sets them.

# Memory
vm.max_map_count = 1048575
vm.swappiness = 1
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.zone_reclaim_mode = 0
kernel.numa_balancing = 0

# Profiling: async-profiler and perf need these.
kernel.perf_event_paranoid = 1
kernel.kptr_restrict = 0

# File system
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
fs.aio-max-nr = 1048576

# Network
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 250000
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1
net.core.rps_sock_flow_entries = 32768

# The ephemeral range covers the NodePort range and every fixed host-network listener port, so
# those are reserved: an outbound connection never takes one as its source port, and a listener
# that restarts can always bind it again. The list is sorted with adjacent ports merged, the form
# the kernel reads back. Host services no manifest names (K3s, the kubelet, Cilium, the database,
# Tailscale) are listed in Constants.NodeTuning.HOST_SERVICE_PORTS. NodeTuningReservedPortsTest
# fails when a host-network port is missing, or when this list is not in that form.
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.ip_local_reserved_ports = 2020,2379-2382,3000,3080-3081,3100,3200-3201,4040,4240,4244-4245,4317-4318,4320-4321,5000-5001,6443-6444,6831,7000-7001,7199,7946-7949,8080-8081,8888,9009,9042-9043,9095-9099,9142,9234,9400,9435,9500-9599,9878-9879,9890-9891,9962-9965,10010,10248-10260,11211,12345,13133,30000-32767,41641
