# easy-db-lab process limits for a database or workload service. setup_instance.sh installs this
# as /etc/systemd/system/<unit>.d/50-easydblab-limits.conf for cassandra, cassandra-easy-stress,
# k3s and k3s-agent. Every pod is a child of the K3s container runtime, so the k3s units carry
# these limits to every kit database. A running service picks them up at its next restart.
[Service]
LimitNOFILE=1048576
LimitMEMLOCK=infinity
LimitNPROC=infinity
LimitAS=infinity
