# easy-db-lab process limits for a database or workload service. setup_instance.sh installs this
# as /etc/systemd/system/<unit>.d/50-easydblab-limits.conf for cassandra, k3s and k3s-agent.
# Every pod is a child of the K3s container runtime, so the k3s units carry these limits to every
# kit database and every stress run, which is a K8s Job. A running service picks them up at its next
# restart.
[Service]
LimitNOFILE=1048576
LimitMEMLOCK=infinity
LimitNPROC=infinity
LimitAS=infinity
