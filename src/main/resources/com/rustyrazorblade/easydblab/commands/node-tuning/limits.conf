# easy-db-lab process limits for login sessions (ssh, su), the same as the services get.
# Installed as /etc/security/limits.d/50-easydblab.conf. pam_limits does not apply `*` to root,
# so root is named too. Services do not read this file; systemd sets their limits.
*    -  nofile   1048576
*    -  memlock  unlimited
*    -  nproc    unlimited
*    -  as       unlimited
root -  nofile   1048576
root -  memlock  unlimited
root -  nproc    unlimited
root -  as       unlimited
