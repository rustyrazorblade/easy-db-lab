# easy-db-lab default process limits for every service systemd starts, including ones with no
# limits of their own. Installed as /etc/systemd/system.conf.d/50-easydblab-limits.conf; PID 1
# reads it on `systemctl daemon-reexec` and at boot.
[Manager]
DefaultLimitNOFILE=1048576
DefaultLimitMEMLOCK=infinity
DefaultLimitNPROC=infinity
DefaultLimitAS=infinity
