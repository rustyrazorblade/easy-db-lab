  nodeSelector:
    type: db                        # or 'app' for app-pool workloads
  persistence:
    storageClass: edl-local-<your-workload>   # the class `platform create-pvs --kit <your-workload>` creates
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: <your-workload>
      topologyKey: kubernetes.io/hostname
