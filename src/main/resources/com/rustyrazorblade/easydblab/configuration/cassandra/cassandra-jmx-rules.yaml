---
# JMX Metric Insight rules for the OpenTelemetry Java agent on Cassandra nodes.
#
# THIS FILE OWNS EVERY RULE. `otel.jmx.target.system` is deliberately NOT set; `-Dotel.jmx.config`
# pointing here is the agent's only rule source.
#
# That is the point of it. The agent's built-in `experimental-cassandra` target is marked
# experimental upstream, so its metric names may move between agent releases - and every dashboard
# panel migrated onto them would go empty on an agent bump, silently. Owning the rules pins the
# names to this repo, where a rename is a diff and a failing test rather than a surprise.
#
# The first half below is a faithful port of that built-in target as it stands at agent v2.31.1.
# Metric names and attribute expressions are reproduced exactly - renaming any of them here is a
# dashboard rewrite - with one deliberate exception, the latency unit below. The second half is
# ours: the families the built-in never covered.
#
# LATENCY UNIT: microseconds. No `sourceUnit`, so no conversion happens and the raw MBean value is
# reported. That is the same unit `nodetool proxyhistograms` and `nodetool tablehistograms` print,
# which is what makes the dashboard and the oracle directly comparable: 86 against 86, not 86
# against 0.000086. The Prometheus suffix follows the unit, so these series end `_microseconds`.
#
# What an operator reads is a Grafana concern, set by a dashboard variable that scales the query,
# never by changing this file. Changing the unit here would silently rename every series and empty
# every panel reading it. The built-in used `sourceUnit: us` / `unit: s`; that is the one thing
# this file deliberately does not reproduce.
#
# How this file travels: it is a Kotlin classpath resource. `easy-db-lab init` extracts it into the
# cluster workspace, and `easy-db-lab setup-instances` uploads it to /etc/easy-db-lab/ on every
# Cassandra node. `cassandra.in.sh` names that path in `-Dotel.jmx.config`. Editing the copy in the
# workspace and re-running `setup-instances` is therefore enough to change a rule: no AMI rebake,
# and no Gradle rebuild.
#
# One rule per MBean family, deliberately flat. The key is `metricAttribute`, singular.

rules:

  # ==============================================================================================
  # Ported from the agent's built-in experimental-cassandra target.
  # ==============================================================================================

  # --- compaction --------------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=Compaction,name=CompletedTasks
    mapping:
      Value:
        metric: cassandra.compaction.tasks.completed
        type: counter
        unit: "{task}"
        desc: Number of completed compactions since server start.

  - bean: org.apache.cassandra.metrics:type=Compaction,name=PendingTasks
    mapping:
      Value:
        metric: cassandra.compaction.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Estimated number of compactions remaining to perform.

  # Compaction byte progress. A code-based handler, because the Compactions attribute returns a
  # list of maps that no declarative rule can express. The handler ships in the agent jar and is
  # resolved by name, so it works from this file without the built-in target selected.
  - bean: org.apache.cassandra.db:type=CompactionManager
    handler: cassandra-compaction-progress

  # --- storage -----------------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=Storage,name=Load
    mapping:
      Count:
        metric: cassandra.storage.load
        type: updowncounter
        unit: By
        desc: Size of the on disk data size this node manages.

  - bean: org.apache.cassandra.metrics:type=Storage,name=TotalHints
    mapping:
      Count:
        metric: cassandra.storage.hints.count
        type: counter
        unit: "{hint}"
        desc: Number of hint messages written to this node since server start.

  - bean: org.apache.cassandra.metrics:type=Storage,name=TotalHintsInProgress
    mapping:
      Count:
        metric: cassandra.storage.hints.in_progress
        type: updowncounter
        unit: "{hint}"
        desc: Number of hints attempting to be sent currently.

  # --- client request latency --------------------------------------------------------------------
  # Pre-aggregated percentiles off Cassandra's own EstimatedHistogram, the reservoir `nodetool
  # proxyhistograms` prints. They are per node and cannot be re-aggregated into a cluster p99.
  #
  # p999 lives in this block rather than one of its own so it cannot drift from its siblings: it
  # shares their attribute, their unit and their bean list, and a panel plots all four together.
  #
  # The three beans are enumerated rather than matched with scope=*. A wildcard also picks up
  # CASRead, CASWrite and ViewWrite, which do not belong in the read/write/rangeslice contract.
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Latency
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.client.request.latency.p50
        desc: Request latency 50th percentile by operation.
      99thPercentile:
        metric: cassandra.client.request.latency.p99
        desc: Request latency 99th percentile by operation.
      999thPercentile:
        metric: cassandra.client.request.latency.p999
        desc: Request latency 99.9th percentile by operation.
      Max:
        metric: cassandra.client.request.latency.max
        desc: Maximum request latency by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Latency
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    mapping:
      Count:
        metric: cassandra.client.request.count
        type: counter
        unit: "{request}"
        desc: Number of requests by operation.

  # --- client request errors ---------------------------------------------------------------------
  # One rule per error type, with the status hardcoded. Written out longhand rather than with the
  # YAML anchors the built-in uses, so every rule reads on its own.
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Unavailables
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(unavailable)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Timeouts
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(timeout)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Failures
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(failure)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  # ==============================================================================================
  # Ours. Families the built-in target does not cover.
  # ==============================================================================================

  # --- per-table storage -------------------------------------------------------------------------
  # keyspace and table are carried as attributes rather than rolled up, so a dashboard can name one
  # table. `scope` is the table name on a type=Table MBean.
  #
  # Neither value is lowercased, unlike cassandra.operation above. Cassandra keyspace and table
  # names are case-sensitive when quoted, so folding case here would merge two distinct tables into
  # one series.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=LiveDiskSpaceUsed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.disk.space.live
        type: updowncounter
        unit: By
        desc: Disk space used by live SSTables.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=TotalDiskSpaceUsed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.disk.space.total
        type: updowncounter
        unit: By
        desc: Disk space used by all SSTables, including those awaiting removal.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=LiveSSTableCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.sstable.count.live
        type: gauge
        unit: "{sstable}"
        desc: Number of live SSTables.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=PendingCompactions
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.compaction.pending
        type: gauge
        unit: "{task}"
        desc: Compaction tasks queued for this table.

  # --- per-table local latency ------------------------------------------------------------------
  # Local (replica-side) latency, as against the coordinator-side ClientRequest latency above.
  # Coordinator minus local is the network and coordination overhead, which nothing else measures.
  #
  # Same percentiles, same unit and the same bare keyspace/table attributes as the rest of the
  # per-table families, so a panel can subtract one from the other without relabelling.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ReadLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.read.latency.p50
        desc: Local read latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.read.latency.p99
        desc: Local read latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.read.latency.p999
        desc: Local read latency, 99.9th percentile.
      Max:
        metric: cassandra.table.read.latency.max
        desc: Maximum local read latency.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=WriteLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.write.latency.p50
        desc: Local write latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.write.latency.p99
        desc: Local write latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.write.latency.p999
        desc: Local write latency, 99.9th percentile.
      Max:
        metric: cassandra.table.write.latency.max
        desc: Maximum local write latency.

  # SSTables touched per read. A Histogram MBean, so the percentiles are read directly rather than
  # derived from buckets.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=SSTablesPerReadHistogram
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{sstable}"
    mapping:
      50thPercentile:
        metric: cassandra.table.sstables.per.read.p50
        desc: SSTables touched per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.sstables.per.read.p99
        desc: SSTables touched per read, 99th percentile.
      Max:
        metric: cassandra.table.sstables.per.read.max
        desc: SSTables touched per read, maximum.

  # --- thread pools ------------------------------------------------------------------------------
  # `path` separates the internal pools from the request pools, and is kept so the two can be told
  # apart; `scope` is the pool name. Neither is lowercased: the pool names are the identifiers
  # `nodetool tpstats` prints, and matching them exactly is what makes the two comparable.
  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=ActiveTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Value:
        metric: cassandra.thread_pool.tasks.active
        type: gauge
        unit: "{task}"
        desc: Tasks currently running in the pool.

  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=PendingTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Value:
        metric: cassandra.thread_pool.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Tasks queued for the pool.

  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=TotalBlockedTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Count:
        metric: cassandra.thread_pool.tasks.blocked
        type: counter
        unit: "{task}"
        desc: Tasks the pool has blocked on since startup.

  # --- dropped messages --------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=DroppedMessage,scope=*,name=Dropped
    metricAttribute:
      message_type: param(scope)
    mapping:
      Count:
        metric: cassandra.messages.dropped
        type: counter
        unit: "{message}"
        desc: Messages dropped since startup, by verb.

  # --- tombstones --------------------------------------------------------------------------------
  # The usual answer to "why did reads get slow". A Histogram of tombstones per read, so despite the
  # name it counts objects, not time: unit is {tombstone}, NOT us. It carries no DurationUnit
  # attribute, which is how the timers here are told apart from the plain histograms.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=TombstoneScannedHistogram
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{tombstone}"
    mapping:
      50thPercentile:
        metric: cassandra.table.tombstones.scanned.p50
        desc: Tombstones scanned per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.tombstones.scanned.p99
        desc: Tombstones scanned per read, 99th percentile.
      999thPercentile:
        metric: cassandra.table.tombstones.scanned.p999
        desc: Tombstones scanned per read, 99.9th percentile.
      Max:
        metric: cassandra.table.tombstones.scanned.max
        desc: Maximum tombstones scanned in a single read.

  # --- bloom filter ------------------------------------------------------------------------------
  # Explains SSTables-per-read climbing without the data changing shape. Both are Gauges reporting
  # a Value, not Counters.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=BloomFilterFalseRatio
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.bloom_filter.false_ratio
        type: gauge
        unit: "1"
        desc: Fraction of bloom filter checks that were false positives.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=BloomFilterFalsePositives
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.bloom_filter.false_positives
        type: gauge
        unit: "{check}"
        desc: Bloom filter false positives.

  # --- caches ------------------------------------------------------------------------------------
  # scope is the cache name: KeyCache, RowCache, CounterCache. Hits and Requests come as well as
  # HitRate on purpose - a ratio computed from two counters can be re-windowed on a dashboard, and
  # the pre-computed HitRate is a lifetime average that cannot.
  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=HitRate
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.hit_ratio
        type: gauge
        unit: "1"
        desc: Cache hit ratio since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Hits
    metricAttribute:
      cache: param(scope)
    mapping:
      Count:
        metric: cassandra.cache.hits
        type: counter
        unit: "{hit}"
        desc: Cache hits since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Requests
    metricAttribute:
      cache: param(scope)
    mapping:
      Count:
        metric: cassandra.cache.requests
        type: counter
        unit: "{request}"
        desc: Cache requests since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Size
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.size
        type: gauge
        unit: By
        desc: Cache size in bytes.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Entries
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.entries
        type: gauge
        unit: "{entry}"
        desc: Number of entries in the cache.

  # --- memtables ---------------------------------------------------------------------------------
  # The flush half of the write path, opposite the compaction families above.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableOnHeapSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.heap.size
        type: gauge
        unit: By
        desc: On-heap memtable size.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableOffHeapSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.offheap.size
        type: gauge
        unit: By
        desc: Off-heap memtable size.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableLiveDataSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.live_data.size
        type: gauge
        unit: By
        desc: Live data held in the memtable.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableColumnsCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.columns
        type: gauge
        unit: "{column}"
        desc: Columns held in the memtable.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableSwitchCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.memtable.switches
        type: counter
        unit: "{switch}"
        desc: Memtable flushes since startup.

  # --- commit log --------------------------------------------------------------------------------
  # Where a write path stalls before it ever reaches a memtable. The two waiting families are
  # Timers, so they take the same microsecond treatment as every other latency here.
  - bean: org.apache.cassandra.metrics:type=CommitLog,name=PendingTasks
    mapping:
      Value:
        metric: cassandra.commitlog.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Commit log tasks queued.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=TotalCommitLogSize
    mapping:
      Value:
        metric: cassandra.commitlog.size
        type: gauge
        unit: By
        desc: Size of all commit log segments on disk.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=WaitingOnCommit
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p50
        desc: Time a write waited on the commit log, 50th percentile.
      99thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p99
        desc: Time a write waited on the commit log, 99th percentile.
      999thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p999
        desc: Time a write waited on the commit log, 99.9th percentile.
      Max:
        metric: cassandra.commitlog.waiting_on_commit.max
        desc: Longest wait on the commit log.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=WaitingOnSegmentAllocation
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p50
        desc: Time spent waiting for a commit log segment, 50th percentile.
      99thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p99
        desc: Time spent waiting for a commit log segment, 99th percentile.
      999thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p999
        desc: Time spent waiting for a commit log segment, 99.9th percentile.
      Max:
        metric: cassandra.commitlog.waiting_on_segment_allocation.max
        desc: Longest wait for a commit log segment.

  # --- speculative retries -----------------------------------------------------------------------
  # Table level only. There is no ClientRequest speculative-retry bean on 5.0 - a scope=* query
  # against type=ClientRequest,name=Speculative* returns nothing.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=SpeculativeRetries
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.speculative.retries
        type: counter
        unit: "{retry}"
        desc: Speculative retries issued since startup.

  # --- streaming and repair ----------------------------------------------------------------------
  # The cluster-wide totals only. type=Streaming also carries per-peer beans keyed
  # scope=/<ip>.<port>, and type=Repair carries a Retries-<VERB> bean per verb; both are left out
  # deliberately, since they multiply series by peer count and by verb for little added signal.
  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalIncomingBytes
    mapping:
      Count:
        metric: cassandra.streaming.incoming
        type: counter
        unit: By
        desc: Bytes streamed in since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingBytes
    mapping:
      Count:
        metric: cassandra.streaming.outgoing
        type: counter
        unit: By
        desc: Bytes streamed out since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingRepairBytes
    mapping:
      Count:
        metric: cassandra.streaming.repair.outgoing
        type: counter
        unit: By
        desc: Bytes streamed out for repair since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingRepairSSTables
    mapping:
      Count:
        metric: cassandra.streaming.repair.sstables
        type: counter
        unit: "{sstable}"
        desc: SSTables streamed out for repair since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=ActiveOutboundStreams
    mapping:
      Count:
        metric: cassandra.streaming.active
        type: gauge
        unit: "{stream}"
        desc: Outbound streams currently active.

  - bean: org.apache.cassandra.metrics:type=Repair,name=Retries
    mapping:
      Count:
        metric: cassandra.repair.retries
        type: counter
        unit: "{retry}"
        desc: Repair message retries since startup.

  # --- inter-node messaging latency --------------------------------------------------------------
  # Two distinct beans, deliberately kept apart.
  #
  # CrossNodeLatency is the whole-node round trip. The per-datacenter beans are named
  # <dc>-Latency (on this cluster, us-west-2-Latency), and `name=*-Latency` matches only those:
  # the ~79 per-verb beans end in "WaitLatency" with no hyphen before Latency, so they are not
  # swept up here. Those per-verb beans are left unmapped on purpose - mapping them would add
  # roughly 320 series per node for a level of detail no dashboard asks for.
  - bean: org.apache.cassandra.metrics:type=Messaging,name=CrossNodeLatency
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.messaging.cross_node.latency.p50
        desc: Cross-node round trip, 50th percentile.
      99thPercentile:
        metric: cassandra.messaging.cross_node.latency.p99
        desc: Cross-node round trip, 99th percentile.
      999thPercentile:
        metric: cassandra.messaging.cross_node.latency.p999
        desc: Cross-node round trip, 99.9th percentile.
      Max:
        metric: cassandra.messaging.cross_node.latency.max
        desc: Longest cross-node round trip.

  - bean: org.apache.cassandra.metrics:type=Messaging,name=*-Latency
    metricAttribute:
      datacenter: param(name)
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.messaging.datacenter.latency.p50
        desc: Round trip to a datacenter, 50th percentile.
      99thPercentile:
        metric: cassandra.messaging.datacenter.latency.p99
        desc: Round trip to a datacenter, 99th percentile.
      999thPercentile:
        metric: cassandra.messaging.datacenter.latency.p999
        desc: Round trip to a datacenter, 99.9th percentile.
      Max:
        metric: cassandra.messaging.datacenter.latency.max
        desc: Longest round trip to a datacenter.
