---
# JMX Metric Insight rules for the OpenTelemetry Java agent on Cassandra nodes.
#
# THIS FILE OWNS EVERY RULE. `otel.jmx.target.system` is deliberately NOT set; `-Dotel.jmx.config`
# pointing here is the agent's only rule source.
#
# That is the point of it. The agent's built-in `experimental-cassandra` target is marked
# experimental upstream, so its metric names may move between agent releases - and every dashboard
# panel migrated onto them would go empty on an agent bump, silently. Owning the rules pins the
# names to this repo, where a rename is a diff and a failing test rather than a surprise.
#
# The first half below is a faithful port of that built-in target as it stands at agent v2.31.1.
# Metric names and attribute expressions are reproduced exactly - renaming any of them here is a
# dashboard rewrite - with one deliberate exception, the latency unit below. The second half is
# ours: the families the built-in never covered.
#
# LATENCY UNIT: microseconds. No `sourceUnit`, so no conversion happens and the raw MBean value is
# reported. That is the same unit `nodetool proxyhistograms` and `nodetool tablehistograms` print,
# which is what makes the dashboard and the oracle directly comparable: 86 against 86, not 86
# against 0.000086. The Prometheus suffix follows the unit, so these series end `_microseconds`.
#
# What an operator reads is a Grafana concern, set by a dashboard variable that scales the query,
# never by changing this file. Changing the unit here would silently rename every series and empty
# every panel reading it. The built-in used `sourceUnit: us` / `unit: s`; that is the one thing
# this file deliberately does not reproduce.
#
# How this file travels: it is a Kotlin classpath resource. `easy-db-lab init` extracts it into the
# cluster workspace, and `easy-db-lab setup-instances` uploads it to /etc/easy-db-lab/ on every
# Cassandra node. `cassandra.in.sh` names that path in `-Dotel.jmx.config`. Editing the copy in the
# workspace and re-running `setup-instances` is therefore enough to change a rule: no AMI rebake,
# and no Gradle rebuild.
#
# One rule per MBean family, deliberately flat. The key is `metricAttribute`, singular.

rules:

  # ==============================================================================================
  # Ported from the agent's built-in experimental-cassandra target.
  # ==============================================================================================

  # --- compaction --------------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=Compaction,name=CompletedTasks
    mapping:
      Value:
        metric: cassandra.compaction.tasks.completed
        type: counter
        unit: "{task}"
        desc: Number of completed compactions since server start.

  - bean: org.apache.cassandra.metrics:type=Compaction,name=PendingTasks
    mapping:
      Value:
        metric: cassandra.compaction.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Estimated number of compactions remaining to perform.

  # A cumulative Counter, so the read attribute is Count (not Value). Incremented once per
  # compaction from the shared CompactionTask path, by the sum of input scanner bytes, so the
  # iterator and cursor pipelines report the identical quantity and are directly comparable.
  - bean: org.apache.cassandra.metrics:type=Compaction,name=BytesCompacted
    mapping:
      Count:
        metric: cassandra.compaction.bytes.compacted
        type: counter
        unit: By
        desc: Total input bytes fed to compaction merges since server start.

  # Compaction byte progress. A code-based handler, because the Compactions attribute returns a
  # list of maps that no declarative rule can express. The handler ships in the agent jar and is
  # resolved by name, so it works from this file without the built-in target selected.
  - bean: org.apache.cassandra.db:type=CompactionManager
    handler: cassandra-compaction-progress

  # --- storage -----------------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=Storage,name=Load
    mapping:
      Count:
        metric: cassandra.storage.load
        type: updowncounter
        unit: By
        desc: Size of the on disk data size this node manages.

  - bean: org.apache.cassandra.metrics:type=Storage,name=TotalHints
    mapping:
      Count:
        metric: cassandra.storage.hints.count
        type: counter
        unit: "{hint}"
        desc: Number of hint messages written to this node since server start.

  - bean: org.apache.cassandra.metrics:type=Storage,name=TotalHintsInProgress
    mapping:
      Count:
        metric: cassandra.storage.hints.in_progress
        type: updowncounter
        unit: "{hint}"
        desc: Number of hints attempting to be sent currently.

  # --- client request latency --------------------------------------------------------------------
  # Pre-aggregated percentiles off Cassandra's own EstimatedHistogram, the reservoir `nodetool
  # proxyhistograms` prints. They are per node and cannot be re-aggregated into a cluster p99.
  #
  # p999 lives in this block rather than one of its own so it cannot drift from its siblings: it
  # shares their attribute, their unit and their bean list, and a panel plots all four together.
  #
  # The beans are enumerated rather than matched with scope=*. A wildcard also picks up ViewWrite,
  # AccordRead, AccordWrite and one Read-<CL> and Write-<CL> scope per consistency level, each of
  # which would land in cassandra.operation as if it were an operation of its own.
  #
  # CASRead and CASWrite are the lightweight transaction scopes (cassandra_operation="casread" and
  # "caswrite"). They are ClientRequestMetrics like the other three, so they carry the same
  # attributes. One overlap to know: a serial read is also recorded in scope=Read
  # (service/paxos/Paxos.java:976-977, service/StorageProxy.java:2438-2439), so a sum over every
  # operation counts it twice. A CAS write is not recorded in scope=Write. A total that should count
  # each request once filters cassandra_operation!="casread".
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Latency
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.client.request.latency.p50
        desc: Request latency 50th percentile by operation.
      99thPercentile:
        metric: cassandra.client.request.latency.p99
        desc: Request latency 99th percentile by operation.
      999thPercentile:
        metric: cassandra.client.request.latency.p999
        desc: Request latency 99.9th percentile by operation.
      Max:
        metric: cassandra.client.request.latency.max
        desc: Maximum request latency by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Latency
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Latency
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    mapping:
      Count:
        metric: cassandra.client.request.count
        type: counter
        unit: "{request}"
        desc: Number of requests by operation.

  # --- client request errors ---------------------------------------------------------------------
  # One rule per error type, with the status hardcoded. Written out longhand rather than with the
  # YAML anchors the built-in uses, so every rule reads on its own.
  #
  # A CAS error is marked in its CAS scope and in the Read-/Write-<serial CL> scope, never in Read
  # or Write, so the five operations here do not overlap. paxos_variant v2:
  # service/paxos/Paxos.java:1196-1207; v1: service/StorageProxy.java:505-530 and :2404-2428.
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Unavailables
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Unavailables
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(unavailable)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Timeouts
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Timeouts
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(timeout)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=RangeSlice,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Read,name=Failures
      - org.apache.cassandra.metrics:type=ClientRequest,scope=Write,name=Failures
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
      cassandra.status: const(failure)
    mapping:
      Count:
        metric: cassandra.client.request.error
        type: counter
        unit: "{error}"
        desc: Number of request errors by operation.

  # ==============================================================================================
  # Ours. Families the built-in target does not cover.
  # ==============================================================================================

  # --- per-table storage -------------------------------------------------------------------------
  # keyspace and table are carried as attributes rather than rolled up, so a dashboard can name one
  # table. `scope` is the table name on a type=Table MBean.
  #
  # Neither value is lowercased, unlike cassandra.operation above. Cassandra keyspace and table
  # names are case-sensitive when quoted, so folding case here would merge two distinct tables into
  # one series.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=LiveDiskSpaceUsed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.disk.space.live
        type: updowncounter
        unit: By
        desc: Disk space used by live SSTables.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=TotalDiskSpaceUsed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.disk.space.total
        type: updowncounter
        unit: By
        desc: Disk space used by all SSTables, including those awaiting removal.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=LiveSSTableCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.sstable.count.live
        type: gauge
        unit: "{sstable}"
        desc: Number of live SSTables.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=PendingCompactions
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.compaction.pending
        type: gauge
        unit: "{task}"
        desc: Compaction tasks queued for this table.

  # --- per-table local latency ------------------------------------------------------------------
  # Local (replica-side) latency, as against the coordinator-side ClientRequest latency above.
  # Coordinator minus local is the network and coordination overhead, which nothing else measures.
  #
  # Same percentiles, same unit and the same bare keyspace/table attributes as the rest of the
  # per-table families, so a panel can subtract one from the other without relabelling.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ReadLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.read.latency.p50
        desc: Local read latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.read.latency.p99
        desc: Local read latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.read.latency.p999
        desc: Local read latency, 99.9th percentile.
      Max:
        metric: cassandra.table.read.latency.max
        desc: Maximum local read latency.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=WriteLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.write.latency.p50
        desc: Local write latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.write.latency.p99
        desc: Local write latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.write.latency.p999
        desc: Local write latency, 99.9th percentile.
      Max:
        metric: cassandra.table.write.latency.max
        desc: Maximum local write latency.

  # SSTables touched per read. A Histogram MBean, so the percentiles are read directly rather than
  # derived from buckets.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=SSTablesPerReadHistogram
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{sstable}"
    mapping:
      50thPercentile:
        metric: cassandra.table.sstables.per.read.p50
        desc: SSTables touched per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.sstables.per.read.p99
        desc: SSTables touched per read, 99th percentile.
      Max:
        metric: cassandra.table.sstables.per.read.max
        desc: SSTables touched per read, maximum.

  # --- thread pools ------------------------------------------------------------------------------
  # `path` separates the internal pools from the request pools, and is kept so the two can be told
  # apart; `scope` is the pool name. Neither is lowercased: the pool names are the identifiers
  # `nodetool tpstats` prints, and matching them exactly is what makes the two comparable.
  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=ActiveTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Value:
        metric: cassandra.thread_pool.tasks.active
        type: gauge
        unit: "{task}"
        desc: Tasks currently running in the pool.

  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=PendingTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Value:
        metric: cassandra.thread_pool.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Tasks queued for the pool.

  - bean: org.apache.cassandra.metrics:type=ThreadPools,path=*,scope=*,name=TotalBlockedTasks
    metricAttribute:
      pool: param(scope)
      pool_path: param(path)
    mapping:
      Count:
        metric: cassandra.thread_pool.tasks.blocked
        type: counter
        unit: "{task}"
        desc: Tasks the pool has blocked on since startup.

  # --- dropped messages --------------------------------------------------------------------------
  - bean: org.apache.cassandra.metrics:type=DroppedMessage,scope=*,name=Dropped
    metricAttribute:
      message_type: param(scope)
    mapping:
      Count:
        metric: cassandra.messages.dropped
        type: counter
        unit: "{message}"
        desc: Messages dropped since startup, by verb.

  # --- tombstones --------------------------------------------------------------------------------
  # The usual answer to "why did reads get slow". A Histogram of tombstones per read, so despite the
  # name it counts objects, not time: unit is {tombstone}, NOT us. It carries no DurationUnit
  # attribute, which is how the timers here are told apart from the plain histograms.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=TombstoneScannedHistogram
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{tombstone}"
    mapping:
      50thPercentile:
        metric: cassandra.table.tombstones.scanned.p50
        desc: Tombstones scanned per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.tombstones.scanned.p99
        desc: Tombstones scanned per read, 99th percentile.
      999thPercentile:
        metric: cassandra.table.tombstones.scanned.p999
        desc: Tombstones scanned per read, 99.9th percentile.
      Max:
        metric: cassandra.table.tombstones.scanned.max
        desc: Maximum tombstones scanned in a single read.

  # --- bloom filter ------------------------------------------------------------------------------
  # Explains SSTables-per-read climbing without the data changing shape. Both are Gauges reporting
  # a Value, not Counters.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=BloomFilterFalseRatio
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.bloom_filter.false_ratio
        type: gauge
        unit: "1"
        desc: Fraction of bloom filter checks that were false positives.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=BloomFilterFalsePositives
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.bloom_filter.false_positives
        type: gauge
        unit: "{check}"
        desc: Bloom filter false positives.

  # --- caches ------------------------------------------------------------------------------------
  # scope is the cache name: KeyCache, RowCache, CounterCache. Hits and Requests come as well as
  # HitRate on purpose - a ratio computed from two counters can be re-windowed on a dashboard, and
  # the pre-computed HitRate is a lifetime average that cannot.
  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=HitRate
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.hit_ratio
        type: gauge
        unit: "1"
        desc: Cache hit ratio since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Hits
    metricAttribute:
      cache: param(scope)
    mapping:
      Count:
        metric: cassandra.cache.hits
        type: counter
        unit: "{hit}"
        desc: Cache hits since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Requests
    metricAttribute:
      cache: param(scope)
    mapping:
      Count:
        metric: cassandra.cache.requests
        type: counter
        unit: "{request}"
        desc: Cache requests since startup.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Size
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.size
        type: gauge
        unit: By
        desc: Cache size in bytes.

  - bean: org.apache.cassandra.metrics:type=Cache,scope=*,name=Entries
    metricAttribute:
      cache: param(scope)
    mapping:
      Value:
        metric: cassandra.cache.entries
        type: gauge
        unit: "{entry}"
        desc: Number of entries in the cache.

  # --- memtables ---------------------------------------------------------------------------------
  # The flush half of the write path, opposite the compaction families above.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableOnHeapSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.heap.size
        type: gauge
        unit: By
        desc: On-heap memtable size.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableOffHeapSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.offheap.size
        type: gauge
        unit: By
        desc: Off-heap memtable size.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableLiveDataSize
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.live_data.size
        type: gauge
        unit: By
        desc: Live data held in the memtable.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableColumnsCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Value:
        metric: cassandra.table.memtable.columns
        type: gauge
        unit: "{column}"
        desc: Columns held in the memtable.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=MemtableSwitchCount
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.memtable.switches
        type: counter
        unit: "{switch}"
        desc: Memtable flushes since startup.

  # Bytes written to SSTables by memtable flush, a cumulative Counter (read Count, not Value). This
  # is the denominator for write amplification: compaction bytes (cassandra.compaction.bytes.compacted)
  # divided by this is how many times the flushed data was rewritten. It is independent of the
  # compaction pipeline, so the iterator and cursor nodes measure amplification against the same base.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=BytesFlushed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.memtable.bytes_flushed
        type: counter
        unit: By
        desc: Bytes flushed from memtables to SSTables since startup.

  # --- commit log --------------------------------------------------------------------------------
  # Where a write path stalls before it ever reaches a memtable. The two waiting families are
  # Timers, so they take the same microsecond treatment as every other latency here.
  - bean: org.apache.cassandra.metrics:type=CommitLog,name=PendingTasks
    mapping:
      Value:
        metric: cassandra.commitlog.tasks.pending
        type: gauge
        unit: "{task}"
        desc: Commit log tasks queued.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=TotalCommitLogSize
    mapping:
      Value:
        metric: cassandra.commitlog.size
        type: gauge
        unit: By
        desc: Size of all commit log segments on disk.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=WaitingOnCommit
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p50
        desc: Time a write waited on the commit log, 50th percentile.
      99thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p99
        desc: Time a write waited on the commit log, 99th percentile.
      999thPercentile:
        metric: cassandra.commitlog.waiting_on_commit.p999
        desc: Time a write waited on the commit log, 99.9th percentile.
      Max:
        metric: cassandra.commitlog.waiting_on_commit.max
        desc: Longest wait on the commit log.

  - bean: org.apache.cassandra.metrics:type=CommitLog,name=WaitingOnSegmentAllocation
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p50
        desc: Time spent waiting for a commit log segment, 50th percentile.
      99thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p99
        desc: Time spent waiting for a commit log segment, 99th percentile.
      999thPercentile:
        metric: cassandra.commitlog.waiting_on_segment_allocation.p999
        desc: Time spent waiting for a commit log segment, 99.9th percentile.
      Max:
        metric: cassandra.commitlog.waiting_on_segment_allocation.max
        desc: Longest wait for a commit log segment.

  # --- speculative retries -----------------------------------------------------------------------
  # Table level only. There is no ClientRequest speculative-retry bean on 5.0 - a scope=* query
  # against type=ClientRequest,name=Speculative* returns nothing.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=SpeculativeRetries
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.speculative.retries
        type: counter
        unit: "{retry}"
        desc: Speculative retries issued since startup.

  # --- streaming and repair ----------------------------------------------------------------------
  # The cluster-wide totals only. type=Streaming also carries per-peer beans keyed
  # scope=/<ip>.<port>, and type=Repair carries a Retries-<VERB> bean per verb; both are left out
  # deliberately, since they multiply series by peer count and by verb for little added signal.
  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalIncomingBytes
    mapping:
      Count:
        metric: cassandra.streaming.incoming
        type: counter
        unit: By
        desc: Bytes streamed in since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingBytes
    mapping:
      Count:
        metric: cassandra.streaming.outgoing
        type: counter
        unit: By
        desc: Bytes streamed out since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingRepairBytes
    mapping:
      Count:
        metric: cassandra.streaming.repair.outgoing
        type: counter
        unit: By
        desc: Bytes streamed out for repair since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=TotalOutgoingRepairSSTables
    mapping:
      Count:
        metric: cassandra.streaming.repair.sstables
        type: counter
        unit: "{sstable}"
        desc: SSTables streamed out for repair since startup.

  - bean: org.apache.cassandra.metrics:type=Streaming,name=ActiveOutboundStreams
    mapping:
      Count:
        metric: cassandra.streaming.active
        type: gauge
        unit: "{stream}"
        desc: Outbound streams currently active.

  - bean: org.apache.cassandra.metrics:type=Repair,name=Retries
    mapping:
      Count:
        metric: cassandra.repair.retries
        type: counter
        unit: "{retry}"
        desc: Repair message retries since startup.

  # --- inter-node messaging latency --------------------------------------------------------------
  # Two distinct beans, deliberately kept apart.
  #
  # CrossNodeLatency is the whole-node round trip. The per-datacenter beans are named
  # <dc>-Latency (on this cluster, us-west-2-Latency), and `name=*-Latency` matches only those:
  # the ~79 per-verb beans end in "WaitLatency" with no hyphen before Latency, so they are not
  # swept up here. Those per-verb beans are left unmapped on purpose - mapping them would add
  # roughly 320 series per node for a level of detail no dashboard asks for.
  - bean: org.apache.cassandra.metrics:type=Messaging,name=CrossNodeLatency
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.messaging.cross_node.latency.p50
        desc: Cross-node round trip, 50th percentile.
      99thPercentile:
        metric: cassandra.messaging.cross_node.latency.p99
        desc: Cross-node round trip, 99th percentile.
      999thPercentile:
        metric: cassandra.messaging.cross_node.latency.p999
        desc: Cross-node round trip, 99.9th percentile.
      Max:
        metric: cassandra.messaging.cross_node.latency.max
        desc: Longest cross-node round trip.

  - bean: org.apache.cassandra.metrics:type=Messaging,name=*-Latency
    metricAttribute:
      datacenter: param(name)
    type: gauge
    unit: us
    mapping:
      50thPercentile:
        metric: cassandra.messaging.datacenter.latency.p50
        desc: Round trip to a datacenter, 50th percentile.
      99thPercentile:
        metric: cassandra.messaging.datacenter.latency.p99
        desc: Round trip to a datacenter, 99th percentile.
      999thPercentile:
        metric: cassandra.messaging.datacenter.latency.p999
        desc: Round trip to a datacenter, 99.9th percentile.
      Max:
        metric: cassandra.messaging.datacenter.latency.max
        desc: Longest round trip to a datacenter.

  # ==============================================================================================
  # Read-path correctness and repair. Every ObjectName and attribute below is checked against the
  # Cassandra 6.0 source (src/java/org/apache/cassandra/...), cited on each rule. Per-table beans
  # are built by TableMetrics.TableMetricNameFactory (metrics/TableMetrics.java:1327), which gives
  # type=Table,keyspace=<ks>,scope=<table>,name=<metric>.
  #
  # Per table only, like every other per-table family here. Cassandra also registers a
  # type=Keyspace aggregate for most of these; it is left out, since sum by (keyspace) gives the
  # same answer from the per-table series.
  # ==============================================================================================

  # --- per-table range read latency --------------------------------------------------------------
  # The local side of range scans, the third of read/write/range. Same four percentiles, unit and
  # attributes as ReadLatency and WriteLatency, so a panel can plot all three together.
  # Source: metrics/TableMetrics.java:655 createLatencyMetrics("Range", ...); LatencyMetrics.java:94
  # appends "Latency", so the bean is name=RangeLatency. Updated by PartitionRangeReadCommand.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=RangeLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.range.latency.p50
        desc: Local range read latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.range.latency.p99
        desc: Local range read latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.range.latency.p999
        desc: Local range read latency, 99.9th percentile.
      Max:
        metric: cassandra.table.range.latency.max
        desc: Maximum local range read latency.

  # --- live rows scanned -------------------------------------------------------------------------
  # The other half of the tombstone histogram: live rows read per query. Together they show how
  # much of a read was useful work. A Histogram of rows, not a Timer, so the unit is {row}.
  # Source: metrics/TableMetrics.java:820 createTableHistogram("LiveScannedHistogram", ...).
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=LiveScannedHistogram
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{row}"
    mapping:
      50thPercentile:
        metric: cassandra.table.live_rows.scanned.p50
        desc: Live rows scanned per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.live_rows.scanned.p99
        desc: Live rows scanned per read, 99th percentile.
      999thPercentile:
        metric: cassandra.table.live_rows.scanned.p999
        desc: Live rows scanned per read, 99.9th percentile.
      Max:
        metric: cassandra.table.live_rows.scanned.max
        desc: Maximum live rows scanned in a single read.

  # --- replica reconciliation --------------------------------------------------------------------
  # What the coordinator did when replicas disagreed. All three are Meters, so the read attribute
  # is Count.
  #
  # ReadRepairRequests: marked once per blocking read repair mutation sent for this table
  # (service/reads/repair/BlockingPartitionRepair.java). Source: metrics/TableMetrics.java:883.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ReadRepairRequests
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.read_repair.requests
        type: counter
        unit: "{request}"
        desc: Read repair mutations sent for this table since startup.

  # ShortReadProtectionRequests: extra reads issued because a replica returned fewer rows or
  # partitions than the limit after reconciliation. Source: metrics/TableMetrics.java:884.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ShortReadProtectionRequests
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.short_read_protection.requests
        type: counter
        unit: "{request}"
        desc: Short read protection requests since startup.

  # ReplicaFilteringProtectionRequests: extra reads issued to complete rows for a filtering query
  # (ALLOW FILTERING, 2i) at a consistency level above ONE. Source: metrics/TableMetrics.java:885.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ReplicaFilteringProtectionRequests
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.replica_filtering_protection.requests
        type: counter
        unit: "{request}"
        desc: Replica filtering protection requests since startup.

  # Rows replica filtering protection held in memory for one query, the number its warn and fail
  # thresholds act on. A Histogram of rows. Table level only: Cassandra registers no keyspace
  # aggregate for it. Source: metrics/TableMetrics.java:886
  # createHistogram("ReplicaFilteringProtectionRowsCachedPerQuery", true).
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=ReplicaFilteringProtectionRowsCachedPerQuery
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{row}"
    mapping:
      50thPercentile:
        metric: cassandra.table.replica_filtering_protection.rows_cached.p50
        desc: Rows cached by replica filtering protection per query, 50th percentile.
      99thPercentile:
        metric: cassandra.table.replica_filtering_protection.rows_cached.p99
        desc: Rows cached by replica filtering protection per query, 99th percentile.
      Max:
        metric: cassandra.table.replica_filtering_protection.rows_cached.max
        desc: Most rows cached by replica filtering protection for one query.

  # --- repaired data tracking --------------------------------------------------------------------
  # Replicas whose repaired data digests disagreed on a read. Confirmed means every replica's
  # repaired set was conclusive, so the mismatch is real; unconfirmed means at least one was not
  # (for example, pending repair sessions), so it may be a false alarm. Both are Meters. They only
  # move when repaired_data_tracking_for_*_enabled is on.
  # Source: metrics/TableMetrics.java:888 and :889.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=RepairedDataInconsistenciesConfirmed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.repaired_data.inconsistencies.confirmed
        type: counter
        unit: "{inconsistency}"
        desc: Confirmed repaired data inconsistencies since startup.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=RepairedDataInconsistenciesUnconfirmed
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    mapping:
      Count:
        metric: cassandra.table.repaired_data.inconsistencies.unconfirmed
        type: counter
        unit: "{inconsistency}"
        desc: Unconfirmed repaired data inconsistencies since startup.

  # The cost of tracking: rows read past the query limit, and the time spent doing it, so the
  # repaired data digest covers enough. Rows is a Histogram of rows. Time is a plain Timer, which
  # reports in DEFAULT_TIMER_UNIT, microseconds (metrics/CassandraMetricsRegistry.java:104), so it
  # takes the same no-conversion `us` as every other latency here.
  # Source: metrics/TableMetrics.java:891 and :892.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=RepairedDataTrackingOverreadRows
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    type: gauge
    unit: "{row}"
    mapping:
      50thPercentile:
        metric: cassandra.table.repaired_data.overread.rows.p50
        desc: Rows overread for repaired data tracking per read, 50th percentile.
      99thPercentile:
        metric: cassandra.table.repaired_data.overread.rows.p99
        desc: Rows overread for repaired data tracking per read, 99th percentile.
      Max:
        metric: cassandra.table.repaired_data.overread.rows.max
        desc: Most rows overread for repaired data tracking in one read.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=RepairedDataTrackingOverreadTime
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.repaired_data.overread.time.p50
        desc: Time spent overreading for repaired data tracking, 50th percentile.
      99thPercentile:
        metric: cassandra.table.repaired_data.overread.time.p99
        desc: Time spent overreading for repaired data tracking, 99th percentile.
      999thPercentile:
        metric: cassandra.table.repaired_data.overread.time.p999
        desc: Time spent overreading for repaired data tracking, 99.9th percentile.
      Max:
        metric: cassandra.table.repaired_data.overread.time.max
        desc: Longest overread for repaired data tracking.

  # --- read repair, node wide --------------------------------------------------------------------
  # type=ReadRepair has no scope (metrics/ReadRepairMetrics.java:29-30). Both are Meters.
  #
  # RepairedBlocking: reads that had to block on a read repair before answering
  # (service/reads/repair/BlockingReadRepair.java). Source: metrics/ReadRepairMetrics.java:32.
  - bean: org.apache.cassandra.metrics:type=ReadRepair,name=RepairedBlocking
    mapping:
      Count:
        metric: cassandra.read_repair.blocking
        type: counter
        unit: "{read}"
        desc: Reads that blocked on read repair since startup.

  # ReconcileRead: reads that found a digest mismatch and reconciled replicas without writing a
  # repair (read_repair = NONE, service/reads/repair/ReadOnlyReadRepair.java).
  # Source: metrics/ReadRepairMetrics.java:51.
  - bean: org.apache.cassandra.metrics:type=ReadRepair,name=ReconcileRead
    mapping:
      Count:
        metric: cassandra.read_repair.reconcile_reads
        type: counter
        unit: "{read}"
        desc: Reads reconciled without a repair write since startup.

  # --- buffer pools ------------------------------------------------------------------------------
  # Cassandra's off-heap buffer pools. There are two, named by scope: chunk-cache (SSTable reads
  # and the chunk cache) and networking (internode and native transport), created at
  # utils/memory/BufferPools.java:39 and :45. Each registers the same six metrics under
  # type=BufferPool,scope=<pool> (metrics/BufferPoolMetrics.java:29 and :54), so `pool` keeps the
  # two apart. scope=* matches only those two, so it adds 12 series per node, at any table count.
  #
  # Overflow is memory allocated outside the pool, because a buffer was too large or the pool was
  # at capacity; a rising overflow with flat misses is a pool too small for the load.
  #
  # Hits and Misses are Meters (metrics/BufferPoolMetrics.java:56, :58).
  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=Hits
    metricAttribute:
      pool: param(scope)
    mapping:
      Count:
        metric: cassandra.buffer_pool.hits
        type: counter
        unit: "{allocation}"
        desc: Buffer allocations served from the pool since startup.

  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=Misses
    metricAttribute:
      pool: param(scope)
    mapping:
      Count:
        metric: cassandra.buffer_pool.misses
        type: counter
        unit: "{allocation}"
        desc: Buffer allocations the pool could not serve since startup.

  # The four sizes are Gauges in bytes, read as Value (metrics/BufferPoolMetrics.java:60-66).
  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=Capacity
    metricAttribute:
      pool: param(scope)
    mapping:
      Value:
        metric: cassandra.buffer_pool.capacity
        type: gauge
        unit: By
        desc: Configured memory limit for the pool.

  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=Size
    metricAttribute:
      pool: param(scope)
    mapping:
      Value:
        metric: cassandra.buffer_pool.size
        type: gauge
        unit: By
        desc: Memory allocated by the pool, including overflow.

  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=UsedSize
    metricAttribute:
      pool: param(scope)
    mapping:
      Value:
        metric: cassandra.buffer_pool.used
        type: gauge
        unit: By
        desc: Memory in buffers currently handed out, including overflow.

  - bean: org.apache.cassandra.metrics:type=BufferPool,scope=*,name=OverflowSize
    metricAttribute:
      pool: param(scope)
    mapping:
      Value:
        metric: cassandra.buffer_pool.overflow
        type: gauge
        unit: By
        desc: Memory allocated outside the pool.

  # ==============================================================================================
  # Lightweight transactions (Paxos). CAS latency, errors and request counts are in the client
  # request families above, as cassandra_operation="casread" and "caswrite". The families below
  # exist only for CAS. Every ObjectName is checked against the Cassandra 6.0 source.
  #
  # The CAS client request beans are built by CASClientRequestMetrics and
  # CASClientWriteRequestMetrics, registered as scope=CASRead and scope=CASWrite
  # (metrics/ClientRequestsMetricsHolder.java:30-31). Both scopes are enumerated, never scope=*.
  # ==============================================================================================

  # --- CAS contention ----------------------------------------------------------------------------
  # Paxos rounds a CAS request lost to a competing ballot before it succeeded. A Histogram of
  # attempts, not a Timer, so the unit is {attempt}. Updated only for a request that saw contention
  # at least once (service/paxos/Paxos.java:871 and :981), so the percentiles describe contended
  # requests only, and Count is the number of contended requests.
  # Source: metrics/CASClientRequestMetrics.java:40 histogram("ContentionHistogram").
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=ContentionHistogram
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=ContentionHistogram
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    type: gauge
    unit: "{attempt}"
    mapping:
      50thPercentile:
        metric: cassandra.client.request.cas.contention.p50
        desc: Paxos attempts lost to contention per contended CAS request, 50th percentile.
      99thPercentile:
        metric: cassandra.client.request.cas.contention.p99
        desc: Paxos attempts lost to contention per contended CAS request, 99th percentile.
      999thPercentile:
        metric: cassandra.client.request.cas.contention.p999
        desc: Paxos attempts lost to contention per contended CAS request, 99.9th percentile.
      Max:
        metric: cassandra.client.request.cas.contention.max
        desc: Most Paxos attempts lost to contention by one CAS request.
      Count:
        metric: cassandra.client.request.cas.contended
        type: counter
        unit: "{request}"
        desc: CAS requests that lost at least one Paxos attempt to contention, since startup.

  # --- CAS unfinished commits --------------------------------------------------------------------
  # Times a CAS request found an accepted but uncommitted proposal from an earlier round and had to
  # finish it before its own. A Counter, so the read attribute is Count.
  # Source: metrics/CASClientRequestMetrics.java:41 counter("UnfinishedCommit"); incremented at
  # service/paxos/Paxos.java:1081-1083.
  - beans:
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASRead,name=UnfinishedCommit
      - org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=UnfinishedCommit
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    mapping:
      Count:
        metric: cassandra.client.request.cas.unfinished_commits
        type: counter
        unit: "{commit}"
        desc: Earlier uncommitted Paxos proposals a CAS request had to finish, since startup.

  # --- CAS condition not met ---------------------------------------------------------------------
  # CAS writes whose IF condition did not match the current row, so nothing was written. A Counter.
  # CASWrite only. Cassandra also registers the same counter under scope=CASRead as a pre-4.0 alias
  # (metrics/CASClientWriteRequestMetrics.java:44-46); matching it too would count every write twice.
  # Source: metrics/CASClientWriteRequestMetrics.java:45 counter("ConditionNotMet").
  - bean: org.apache.cassandra.metrics:type=ClientRequest,scope=CASWrite,name=ConditionNotMet
    metricAttribute:
      cassandra.operation: lowercase(param(scope))
    mapping:
      Count:
        metric: cassandra.client.request.cas.condition_not_met
        type: counter
        unit: "{request}"
        desc: CAS writes whose condition did not apply, since startup.

  # --- Paxos linearizability violations ----------------------------------------------------------
  # A Paxos prepare saw a committed value older than one it had already witnessed. Any non-zero
  # value is a correctness bug. type=Paxos has no scope (DefaultNameFactory, type=Paxos,name=...).
  # Source: metrics/PaxosMetrics.java:30 counter("LinearizabilityViolations"); incremented at
  # service/paxos/PaxosPrepare.java:814.
  - bean: org.apache.cassandra.metrics:type=Paxos,name=LinearizabilityViolations
    mapping:
      Count:
        metric: cassandra.paxos.linearizability_violations
        type: counter
        unit: "{violation}"
        desc: Paxos linearizability violations detected since startup.

  # --- latency at one consistency level ----------------------------------------------------------
  # ClientRequestMetrics also keeps one scope per consistency level, Read-<CL> and Write-<CL>
  # (metrics/ClientRequestsMetricsHolder.java:41-45). Plain scope=Read includes serial reads, so it
  # cannot show regular read latency apart from LWT reads; Read-QUORUM can. A serial read is
  # recorded under Read-SERIAL or Read-LOCAL_SERIAL (service/paxos/Paxos.java:978), and a CAS write
  # under Write-SERIAL or Write-LOCAL_SERIAL (:879).
  #
  # One rule per scope, with operation and consistency level as constants, because no attribute
  # expression can split "Read-QUORUM" into two values. Add a rule here for another level.
  #
  # One caveat, on paxos_variant: v1 only. Its CAS write reads the current row with readOne at
  # QUORUM or LOCAL_QUORUM (service/StorageProxy.java:450-455), which records that read under
  # Read-QUORUM too. paxos_variant: v2 reads during the prepare, which records nothing here.
  - bean: org.apache.cassandra.metrics:type=ClientRequest,scope=Read-QUORUM,name=Latency
    metricAttribute:
      cassandra.operation: const(read)
      cassandra.consistency_level: const(quorum)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.client.request.consistency.latency.p50
        desc: Request latency 50th percentile by operation and consistency level.
      99thPercentile:
        metric: cassandra.client.request.consistency.latency.p99
        desc: Request latency 99th percentile by operation and consistency level.
      999thPercentile:
        metric: cassandra.client.request.consistency.latency.p999
        desc: Request latency 99.9th percentile by operation and consistency level.
      Max:
        metric: cassandra.client.request.consistency.latency.max
        desc: Maximum request latency by operation and consistency level.

  - bean: org.apache.cassandra.metrics:type=ClientRequest,scope=Write-QUORUM,name=Latency
    metricAttribute:
      cassandra.operation: const(write)
      cassandra.consistency_level: const(quorum)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.client.request.consistency.latency.p50
        desc: Request latency 50th percentile by operation and consistency level.
      99thPercentile:
        metric: cassandra.client.request.consistency.latency.p99
        desc: Request latency 99th percentile by operation and consistency level.
      999thPercentile:
        metric: cassandra.client.request.consistency.latency.p999
        desc: Request latency 99.9th percentile by operation and consistency level.
      Max:
        metric: cassandra.client.request.consistency.latency.max
        desc: Maximum request latency by operation and consistency level.

  # --- per-table Paxos phase latency -------------------------------------------------------------
  # Replica-side time for each Paxos phase on this table: prepare (promise and read), propose
  # (accept) and commit. They are the local half of CAS latency, as ReadLatency is for reads.
  # Timers in microseconds (LatencyMetrics.java:89), like every other latency here.
  # Source: metrics/TableMetrics.java:847-849 createLatencyMetrics("CasPrepare" / "CasPropose" /
  # "CasCommit"); LatencyMetrics.java:94 appends "Latency". Updated in service/paxos/PaxosState.java
  # (:740, :784, :830), PaxosPrepare.java:1148 and PaxosPropose.java:444.
  #
  # Thread pool and dropped message metrics need no rule of their own here. The PAXOS2_* request
  # verbs run on MutationStage (net/Verb.java:281-290), which the type=ThreadPools rules cover, and
  # every verb has a DroppedMessage bean (metrics/MessagingMetrics.java:111-112), which the
  # type=DroppedMessage rule covers as message_type="PAXOS2_PREPARE_REQ" and so on.
  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=CasPrepareLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.cas.prepare.latency.p50
        desc: Local Paxos prepare latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.cas.prepare.latency.p99
        desc: Local Paxos prepare latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.cas.prepare.latency.p999
        desc: Local Paxos prepare latency, 99.9th percentile.
      Max:
        metric: cassandra.table.cas.prepare.latency.max
        desc: Maximum local Paxos prepare latency.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=CasProposeLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.cas.propose.latency.p50
        desc: Local Paxos propose latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.cas.propose.latency.p99
        desc: Local Paxos propose latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.cas.propose.latency.p999
        desc: Local Paxos propose latency, 99.9th percentile.
      Max:
        metric: cassandra.table.cas.propose.latency.max
        desc: Maximum local Paxos propose latency.

  - bean: org.apache.cassandra.metrics:type=Table,keyspace=*,scope=*,name=CasCommitLatency
    metricAttribute:
      keyspace: param(keyspace)
      table: param(scope)
    unit: us
    type: gauge
    mapping:
      50thPercentile:
        metric: cassandra.table.cas.commit.latency.p50
        desc: Local Paxos commit latency, 50th percentile.
      99thPercentile:
        metric: cassandra.table.cas.commit.latency.p99
        desc: Local Paxos commit latency, 99th percentile.
      999thPercentile:
        metric: cassandra.table.cas.commit.latency.p999
        desc: Local Paxos commit latency, 99.9th percentile.
      Max:
        metric: cassandra.table.cas.commit.latency.max
        desc: Maximum local Paxos commit latency.
