receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'cassandra-easy-stress'
          scrape_interval: 5s
          static_configs:
            - targets: ['localhost:${env:STRESS_PROM_PORT}']
          relabel_configs:
            - target_label: instance
              replacement: '${env:K8S_NODE_NAME}:${env:STRESS_PROM_PORT}'
            - target_label: cluster
              replacement: '${env:CLUSTER_NAME}'

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource_detection:
    detectors: [env]
    timeout: 2s
    override: false

exporters:
  # The node collector restarts on every kit start and stop (its config changes). This exporter
  # holds what it cannot send in memory and retries without a time limit, as the node collector's
  # backend exporters do (issue 991). No on-disk queue. The sidecar sets no GOMEMLIMIT, so a long
  # outage grows the heap with the queue instead of running the Go GC against a soft limit. The
  # queue is bounded at 64 MiB of OTLP proto bytes (issue 1002): the sidecar carries only the stress
  # process's own metrics, and it shares the app node with the stress job.
  otlp_grpc:
    endpoint: ${env:HOST_IP}:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 67108864

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource_detection, batch]
      exporters: [otlp_grpc]
