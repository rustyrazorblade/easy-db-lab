receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  host_metrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      load:
      filesystem:
      memory:
      network:
      processes:
  # The log files EMR and YARN write on the node. Paths per the EMR Management Guide ("View Amazon EMR
  # log files": step logs in /mnt/var/log/hadoop/steps/<step-id>/ on the primary node, bootstrap
  # action logs in /emr/instance-controller/log/bootstrap-actions) and the knowledge-center article
  # "How can I push Amazon EMR application logs to CloudWatch?" (YARN container logs in
  # /var/log/hadoop-yarn/containers/application_*/container_*/). A driver that dies before its
  # Java agent exports anything leaves its exception only here. The files are new on every node, so
  # every line is read from the start. The files belong to EMR and YARN users; the bootstrap action
  # runs this collector as root (User=root), so it reads all of them.
  file_log/emr:
    include:
      - /var/log/hadoop-yarn/containers/application_*/container_*/*
      - /mnt/var/log/hadoop/steps/*/*
      - /emr/instance-controller/log/bootstrap-actions/*/*
    exclude:
      - /**/*.gz
    start_at: beginning
    include_file_path: true
    include_file_name: true

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  resource_detection:
    detectors: [system]
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.name:
          enabled: true
  resource/role:
    attributes:
      - key: node_role
        # __NODE_ROLE__ is intentionally left unresolved by TemplateService at S3
        # upload time. The bootstrap action patches it per-node to spark-master or
        # spark-worker so master and worker telemetry can be filtered independently.
        value: __NODE_ROLE__
        action: upsert
  # Loki indexes `source`, so `logs query --source emr` finds every EMR node's lines.
  resource/source:
    attributes:
      - key: source
        value: emr
        action: upsert

exporters:
  otlp_grpc/control:
    endpoint: __CONTROL_NODE_IP__:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp, host_metrics]
      processors: [resource_detection, resource/role, batch]
      exporters: [otlp_grpc/control]
    logs:
      receivers: [otlp, file_log/emr]
      processors: [resource_detection, resource/role, resource/source, batch]
      exporters: [otlp_grpc/control]
    traces:
      receivers: [otlp]
      processors: [resource_detection, resource/role, batch]
      exporters: [otlp_grpc/control]
