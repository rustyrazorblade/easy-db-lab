# The read-only documents web server in the Grafana pod.
#
# The browser loads a test's documents from here, the same way it reaches Grafana. Only GET requests
# for paths under /reports/ go on, to the signing proxy on loopback, which reads the account bucket
# with the instance role. nginx normalizes the path first, so /reports/../mimir/ is /mimir/ and is
# refused. The query string is dropped and the bucket is fixed here, so a request cannot name
# another bucket or an S3 sub-resource.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen __DOCUMENTS_WEB_PORT__;

        location /reports/ {
            if ($request_method != GET) {
                return 405;
            }
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:__DOCUMENTS_PROXY_PORT__/__DOCUMENTS_BUCKET__$uri;
        }

        location / {
            return 404;
        }
    }
}
