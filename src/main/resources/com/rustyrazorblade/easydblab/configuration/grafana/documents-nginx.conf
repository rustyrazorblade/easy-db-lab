# The read-only documents web server: in the Grafana pod on a cluster, and in the local docker
# compose stack.
#
# The browser loads a test's documents from here, the same way it reaches Grafana. Only GET requests
# for paths under /reports/ go on, to the upstream: on a cluster the signing proxy on loopback, which
# reads the account bucket with the instance role; in the local stack the read gate in front of the
# signer, which reads it with the operator's profile. nginx decodes and normalizes the path first, so /reports/../mimir/ is
# /mimir/ and is refused. A decoded path must then hold only the document name characters, so an
# encoded line break cannot split the request and an encoded "?" cannot add a query. proxy_pass
# names a fixed URI with no variables, so nginx re-encodes the path itself, and the query string is
# cleared, so a request cannot name another bucket or an S3 sub-resource.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen __DOCUMENTS_WEB_PORT__;

        location /reports/ {
            if ($request_method != GET) {
                return 405;
            }
            if ($uri !~ "^/reports/[A-Za-z0-9._/-]+$") {
                return 400;
            }
            set $args "";
            proxy_http_version 1.1;
            proxy_pass http://__DOCUMENTS_UPSTREAM__/__DOCUMENTS_BUCKET__/reports/;
        }

        location / {
            return 404;
        }
    }
}
