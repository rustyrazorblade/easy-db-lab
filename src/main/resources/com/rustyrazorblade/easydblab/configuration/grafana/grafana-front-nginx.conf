# The nginx in front of Grafana, in the Grafana pod. It holds Grafana's client port, the one port the
# grafana Service targets and, on AWS, the control node publishes. So the browser reaches Grafana and
# a test's documents over one connection, a 127.0.0.1 port-forward or the SOCKS path, and the
# dashboards' documents iframe is a relative, same-origin /reports/ URL.
#
# /reports/: only GET and HEAD go on, to the signing proxy on loopback, which reads the account
# bucket with the default credential chain. nginx decodes and normalizes the path first, so
# /reports/../mimir/ is /mimir/ and goes to Grafana, never to the proxy. A decoded path must then hold
# only the document name characters, so an encoded line break cannot split the request and an
# encoded "?" cannot add a query. proxy_pass names a fixed URI with no variables, so nginx re-encodes
# the path itself, and the query string is cleared, so a request cannot name another bucket or an S3
# sub-resource.
#
# Everything else goes to Grafana on its loopback port, with the Host header kept (Grafana Live
# checks a websocket's Origin against it), the websocket upgrade passed through for /api/live/ws,
# no request body limit (dashboard and annotation imports) and an hour's read timeout for a live
# connection that is idle.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen __GRAFANA_PORT__;
        client_max_body_size 0;

        location /reports/ {
            if ($request_method !~ "^(GET|HEAD)$") {
                return 405;
            }
            if ($uri !~ "^/reports/[A-Za-z0-9._/-]+$") {
                return 400;
            }
            set $args "";
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:__DOCUMENTS_PROXY_PORT__/__DOCUMENTS_BUCKET__/reports/;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://127.0.0.1:__GRAFANA_INTERNAL_PORT__;
        }
    }
}
