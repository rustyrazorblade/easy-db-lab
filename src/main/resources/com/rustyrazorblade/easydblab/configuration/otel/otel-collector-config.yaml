receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Jaeger Thrift Compact (UDP 6831) — receives traces from TiDB's built-in OpenTracing reporter.
  # TiDB v8.x has no native OTel support; it uses the OpenTracing/Jaeger protocol instead.
  # The OTel Collector translates Jaeger spans to OTLP and forwards them to Tempo.
  jaeger:
    protocols:
      thrift_compact:
        endpoint: 0.0.0.0:6831
  # The kubelet's per-node, per-pod and per-container resource figures, read from this node's own
  # kubelet (RBAC nodes/stats). The core is on the pod network, so the node is reached at its IP.
  # Runs on every environment: it adds k8s.* and container.* series and none collide with others.
  kubelet_stats:
    collection_interval: 15s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    # The kubelet is verified, not trusted blind: K3s signs each kubelet serving cert with its
    # server CA, the CA the service account mounts, and puts the node IP in its SANs.
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  prometheus:
    config:
      scrape_configs:
        # The collector's own telemetry: exporter send failures, queue sizes, refused points. Without
        # it a Tempo exporter failing every send looks exactly like a cluster with no traffic.
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']
          relabel_configs:
            - target_label: instance
              replacement: '${env:K8S_NODE_NAME}:8888'
            - target_label: cluster
              replacement: '${env:CLUSTER_NAME}'
        # Built by OtelManifestBuilder: the Mimir, Loki, Tempo and Pyroscope server jobs (local mode
        # only; a redirect cluster deploys none of them), the kube-state-metrics pod-discovery job
        # (every cluster) and the YACE job (CloudWatch only). The pod-discovery jobs are rendered in
        # Kotlin rather than written here because their relabel rules name Prometheus meta labels,
        # whose double-underscore prefix and suffix is the template placeholder syntax of
        # TemplateService: written in this file they would derail every substitution after them.
        # Host sources (Beyla, ebpf_exporter, Cilium, host metrics and host files) are in the host
        # add-on, otel-host-collector-config.yaml, which forwards to this collector over OTLP.
__INFRA_SCRAPE_JOBS__
__KIT_SCRAPE_JOBS__
__POD_LOG_RECEIVERS__

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  # Required by the metrics/logs pipeline, and the single most silent failure in this file.
  #
  # The count connector emits Sums with AggregationTemporality: Delta, and signal_to_metrics emits
  # delta histograms. prometheus_remote_write accepts CUMULATIVE ONLY and discards delta points
  # without an error log, without incrementing send_failed, and without any dropped-points counter.
  # Every diagnostic surface reports a healthy pipeline while the data goes nowhere.
  #
  # That is not a hypothetical: it is exactly how this shipped the first time. The connectors were
  # producing correct points carrying cassandra_build, host.name and node_role, the OTTL conditions
  # matched, the pipeline was constructed - and cassandra_log_* never appeared in the metrics store.
  # It was found only by attaching a debug exporter to the pipeline and reading the descriptor.
  #
  # Anything added to metrics/logs later inherits this constraint. A connector-derived metric that
  # bypasses this processor disappears the same silent way.
  delta_to_cumulative:
    max_stale: 5m
  resource/cluster:
    attributes:
      - action: upsert
        key: cluster
        value: '${env:CLUSTER_NAME}'
  # Strip the SDK's default resource from OTLP metrics.
  #
  # The OTel Java agent stamps every export with its own identity and the JVM's. None of it is
  # queryable, and process.command_line is actively harmful: it carries the full argv, so it CHANGES
  # on `cassandra use` and mints a whole new series set, breaking panel continuity across a version
  # switch. The agent-side property otel.experimental.resource.disabled.keys does not work at
  # v2.31.1, so the drop happens here.
  #
  # process.command_args is the same argv as a list. The agent reports it instead of
  # process.command_line where it can read the JVM's arguments (a JVM in a container, such as
  # Neo4j's), so both keys are dropped.
  #
  # container.id comes from the same containerised JVMs and is new on every pod restart, so it too
  # would mint a fresh series set each time; no dashboard selects on it.
  #
  # What survives is what a dashboard actually selects on: cluster, host.name, node_role, instance,
  # job, service.name, service.instance.id, and the rule-supplied keyspace, table,
  # cassandra.operation and cassandra.status.
  resource/drop_sdk_metadata:
    attributes:
      - action: delete
        key: process.command_line
      - action: delete
        key: process.command_args
      - action: delete
        key: process.executable.path
      - action: delete
        key: process.pid
      - action: delete
        key: container.id
      - action: delete
        key: process.runtime.description
      - action: delete
        key: process.runtime.name
      - action: delete
        key: process.runtime.version
      - action: delete
        key: os.description
      - action: delete
        key: os.type
      - action: delete
        key: os.version
      - action: delete
        key: host.arch
      - action: delete
        key: telemetry.distro.name
      - action: delete
        key: telemetry.distro.version
      - action: delete
        key: telemetry.sdk.language
      - action: delete
        key: telemetry.sdk.name
      - action: delete
        key: telemetry.sdk.version
  # host.name is this node's Kubernetes name (K8S_NODE_NAME, from spec.nodeName). The collector runs
  # on the pod network, so the OS hostname a system detector would read is the collector pod's name.
  resource/host_name:
    attributes:
      - action: upsert
        key: host.name
        value: ${env:K8S_NODE_NAME}
  # An EMR node's collector sends its own host.name (and node_role spark-master or spark-worker)
  # over OTLP to this collector. resource/host_name overwrites host.name with this node's, which is
  # right for a JVM in a pod (it reports the pod's name) and wrong for EMR: every Spark master and
  # worker arrived as host_name="control0", collided with the real control node, and made the
  # host-joined panels fail with "found duplicate series". metrics/otlp sets the EMR host aside
  # before resource/host_name and puts it back after.
  transform/keep_emr_host:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(attributes["easydblab.emr_host_name"], attributes["host.name"]) where IsMatch(attributes["node_role"], "^spark-(master|worker)$")
  transform/restore_emr_host:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], attributes["easydblab.emr_host_name"]) where attributes["easydblab.emr_host_name"] != nil
          - delete_key(attributes, "easydblab.emr_host_name")
  # Copy k8s.app.instance resource attribute to a log-level service attribute so
  # container logs share the same service field as journald logs.
  transform/add_service:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["service"], resource.attributes["k8s.app.instance"]) where resource.attributes["k8s.app.instance"] != ""

  # Lift the logger name and severity onto the log record so the count connector can group by them.
  #
  # The Java agent puts the logger name in the InstrumentationScope, not in the record's attributes,
  # and the count connector's `attributes` reads record attributes only. Without this copy, counting
  # "by logger" silently groups everything into one series.
  transform/log_metric_labels:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["logger"], instrumentation_scope.name) where instrumentation_scope.name != ""
          - set(attributes["severity"], severity_text) where severity_text != ""

          # EVERY numeric capture below allows a comma and strips it before converting. Cassandra
          # prints large numbers with thousands separators - "in 520,866ms" is a real line from this
          # cluster - and a [0-9]+ capture does not fail loudly on one. It either matches nothing,
          # losing exactly the slowest events, or matches the leading group and is wrong by three
          # orders of magnitude. Both were measured; neither reports an error.

          # GC events. GCInspector logs one line per collection carrying the duration the JVM
          # metrics only expose in aggregate. Both collectors use the same shape, so one pattern
          # serves G1 and ZGC:
          #   "G1 Young Generation GC in 635ms.  G1 Eden Space: 8220835840 -> 0; ..."
          #   "ZGC Major Cycles GC in 76,781ms.  ZGC Old Generation: 58720256 -> 167772160; ..."
          #
          # gc_name is the label and it is load-bearing, not decoration. A "ZGC Major Cycles" line
          # times CONCURRENT work - 76 seconds of it - while a "G1 Young Generation" line times a
          # stop-the-world pause of a few hundred ms. Averaging across the two produces a number
          # that means nothing, which is why the metric is named for the event's duration rather
          # than for a pause: a consumer wanting pauses filters gc_name, exactly as on the JMX side.
          #
          # The heap before/after figures in the rest of the line are left alone - per-pool, and
          # already covered by jvm.memory.used.
          - >-
            merge_maps(attributes,
              ExtractPatterns(body, "^(?P<gc_name>[A-Za-z0-9 ]+?) GC in (?P<gc_event_ms>[0-9,]+)ms"),
              "upsert")
            where IsMatch(body, "GC in [0-9,]+ms")
          - replace_pattern(attributes["gc_event_ms"], ",", "") where attributes["gc_event_ms"] != nil
          - set(attributes["gc_event_ms"], Double(attributes["gc_event_ms"])) where attributes["gc_event_ms"] != nil

          # Compactions. CompactionTask logs one line per compaction:
          #   "Compacted (<uuid>) 4 sstables to [<path>,] to level=0.  9.049KiB to 4.033KiB
          #    (~44% of original) in 520,866ms. ... 7 total partitions merged to 3. ..."
          #
          # The ratio is taken straight from the "(~44% of original)" the line already computes -
          # the one figure here that nothing else exposes. The byte counts on either side of it are
          # human-formatted ("9.049KiB"), so reading them would mean unit handling for a number the
          # compaction byte counters already carry; the ratio makes them unnecessary anyway.
          #
          # The uuid and the sstable path on this line are unbounded and are labels on nothing.
          - >-
            merge_maps(attributes,
              ExtractPatterns(body, "^Compacted \\([^)]+\\) (?P<compaction_sstables>[0-9,]+) sstables"),
              "upsert")
            where IsMatch(body, "^Compacted \\(")
          - >-
            merge_maps(attributes,
              ExtractPatterns(body, "\\(~(?P<compaction_ratio_pct>[0-9,]+)% of original\\)"),
              "upsert")
            where IsMatch(body, "^Compacted \\(")
          - >-
            merge_maps(attributes,
              ExtractPatterns(body, "of original\\) in (?P<compaction_ms>[0-9,]+)ms"),
              "upsert")
            where IsMatch(body, "^Compacted \\(")
          # Dropped messages. One line per verb per 5-second window:
          #   "MUTATION_RSP messages were dropped in last 5000 ms: 0 internal and 33 cross node.
          #    Mean internal dropped latency: 0 ms and Mean cross-node dropped latency: 4 ms"
          #
          # The JMX counter says how many messages dropped. Only this line says of WHAT TYPE, and
          # splits internal from cross-node - a distinction the counter cannot express and the one
          # that separates "this node is overloaded" from "the network or a peer is".
          #
          # The logger is org.apache.cassandra.metrics.MessagingMetrics. It is neither
          # MessagingService nor NoSpamLogger, which is what makes this worth pinning: a condition
          # on the wrong logger matches nothing, forever, without an error.
          #
          # dropped_type is a verb name from a bounded set. Every count and latency is a value.
          - >-
            merge_maps(attributes,
              ExtractPatterns(body,
                "^(?P<dropped_type>[A-Z0-9_]+) messages were dropped in last [0-9,]+ ms: (?P<dropped_internal>[0-9,]+) internal and (?P<dropped_cross_node>[0-9,]+) cross node\\. Mean internal dropped latency: (?P<dropped_internal_ms>[0-9,]+) ms and Mean cross-node dropped latency: (?P<dropped_cross_node_ms>[0-9,]+) ms"),
              "upsert")
            where IsMatch(body, "messages were dropped in last")
          - replace_pattern(attributes["dropped_internal"], ",", "") where attributes["dropped_internal"] != nil
          - replace_pattern(attributes["dropped_cross_node"], ",", "") where attributes["dropped_cross_node"] != nil
          - replace_pattern(attributes["dropped_internal_ms"], ",", "") where attributes["dropped_internal_ms"] != nil
          - replace_pattern(attributes["dropped_cross_node_ms"], ",", "") where attributes["dropped_cross_node_ms"] != nil
          - set(attributes["dropped_internal"], Double(attributes["dropped_internal"])) where attributes["dropped_internal"] != nil
          - set(attributes["dropped_cross_node"], Double(attributes["dropped_cross_node"])) where attributes["dropped_cross_node"] != nil
          - set(attributes["dropped_internal_ms"], Double(attributes["dropped_internal_ms"])) where attributes["dropped_internal_ms"] != nil
          - set(attributes["dropped_cross_node_ms"], Double(attributes["dropped_cross_node_ms"])) where attributes["dropped_cross_node_ms"] != nil

          - replace_pattern(attributes["compaction_sstables"], ",", "") where attributes["compaction_sstables"] != nil
          - replace_pattern(attributes["compaction_ratio_pct"], ",", "") where attributes["compaction_ratio_pct"] != nil
          - replace_pattern(attributes["compaction_ms"], ",", "") where attributes["compaction_ms"] != nil
          - set(attributes["compaction_sstables"], Double(attributes["compaction_sstables"])) where attributes["compaction_sstables"] != nil
          - set(attributes["compaction_ratio_pct"], Double(attributes["compaction_ratio_pct"])) where attributes["compaction_ratio_pct"] != nil
          - set(attributes["compaction_ms"], Double(attributes["compaction_ms"])) where attributes["compaction_ms"] != nil

  # Moves a record's `source` onto its resource, where Loki indexes it as a label. Fluent Bit sets
  # `source: journald` on each record it forwards over OTLP; every record in one of its batches has
  # the same source, so the resource takes that one value. Loki derives service_name itself.
  transform/source_to_resource:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["source"], attributes["source"]) where attributes["source"] != nil
          - delete_key(attributes, "source") where attributes["source"] != nil

  # The node's role from its host name (owner decision): db<N> is db, app<N> is app, control<N> is
  # control. Host metrics and host log files carry no pod, so k8s_attributes can never find the
  # node's `type` label for them, and they reached the store with no node_role at all. A node_role
  # that is already set, by k8s_attributes for a scraped kit pod or by an EMR node's own collector,
  # is left alone, so this runs after k8s_attributes.
  transform/node_role_from_host:
    # Fail fast: since the rename the transform processor ignores statement errors by default.
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - set(attributes["node_role"], "db") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^db[0-9]+$")
          - set(attributes["node_role"], "app") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^app[0-9]+$")
          - set(attributes["node_role"], "control") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^control[0-9]+$")
    log_statements:
      - context: resource
        statements:
          - set(attributes["node_role"], "db") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^db[0-9]+$")
          - set(attributes["node_role"], "app") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^app[0-9]+$")
          - set(attributes["node_role"], "control") where attributes["node_role"] == nil and IsMatch(attributes["host.name"], "^control[0-9]+$")

  # Enriches records that carry their pod with the pod's labels (k8s.app.instance, which the kit
  # dashboards select on) and the node's `type` label (db, app) as node_role, by matching the
  # k8s.pod.name and k8s.namespace.name resource attributes. Container logs take them from the log
  # file path; the kit metrics metrics/local scrapes by pod discovery take them from the Prometheus
  # receiver, which sets them from each target. Host metrics and host log files carry no pod.
  k8s_attributes:
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
    extract:
      metadata:
        - k8s.node.name
      labels:
        - tag_name: node_role
          key: type
          from: node
        - tag_name: k8s.app.instance
          key: app.kubernetes.io/instance
          from: pod

exporters:
  # Export destinations are substituted at build time by OtelManifestBuilder: the in-cluster
  # service addresses in local mode, the external stack's endpoints under telemetry redirect.
  # Mimir and Loki run native multi-tenancy: every write carries the cluster's tenant, on a
  # redirected cluster too. TENANT comes from the cluster-config ConfigMap.
  prometheus_remote_write:
    endpoint: __METRICS_ENDPOINT__
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: ${env:TENANT}
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/logs:
    endpoint: __LOGS_ENDPOINT__
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: ${env:TENANT}
  # Tempo runs native multi-tenancy: every write carries the cluster's tenant, on a redirected
  # cluster too. TENANT comes from the cluster-config ConfigMap.
  otlp_grpc/tempo:
    endpoint: __TEMPO_ENDPOINT__
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: ${env:TENANT}

connectors:
  # Turns log records into metrics, so what a logger reports can be charted beside the JMX
  # families and compared across builds instead of being read as text.
  #
  # Nothing here parses a log body. Every label comes from the logger name or the severity, both of
  # which are bounded sets; a body can carry a keyspace, a table, a host or an id, and grouping on
  # any of those would be unbounded. Values that live only inside a message stay in Loki.
  #
  # Resource attributes ride through the connector untouched, so these arrive already carrying
  # cassandra_build, host.name and node_role - which is what makes them comparable per variant.
  count:
    logs:
      cassandra.log.records:
        description: Log records at WARN and above, by logger and severity.
        # severity_number, not severity_text: the text is inconsistent across libraries (Cassandra
        # logs WARN, the AxonOps agent logs WARNING) and would split one level into two series.
        conditions:
          - severity_number >= SEVERITY_NUMBER_WARN and resource.attributes["source"] == nil
        attributes:
          - key: logger
            default_value: unknown
          - key: severity
            default_value: unknown
      cassandra.log.gc_events:
        description: GCInspector log events, which carry pause detail the JVM metrics do not.
        conditions:
          - IsMatch(instrumentation_scope.name, ".*GCInspector$") and resource.attributes["source"] == nil
      cassandra.log.status_dumps:
        description: StatusLogger dumps, which Cassandra emits under pressure.
        conditions:
          - IsMatch(instrumentation_scope.name, ".*StatusLogger$") and resource.attributes["source"] == nil
      cassandra.log.dropped_message_reports:
        description: MessagingMetrics drop reports - one per verb per 5s window in which anything dropped.
        # MessagingMetrics, verified against real lines. An earlier guess at MessagingService and
        # NoSpamLogger matched nothing at all, which is the failure this whole file keeps guarding
        # against: a wrong name here is silent, permanent and looks exactly like "nothing dropped".
        conditions:
          - IsMatch(instrumentation_scope.name, ".*MessagingMetrics$") and resource.attributes["source"] == nil

  # Turns the figures parsed out of a log body into metrics whose VALUE is the number, not the
  # number of records. The count connector above cannot do this: it only ever emits how many
  # matched, so a GC pause would arrive as "47 events" rather than "47.3 ms" - a mistake that looks
  # like it worked.
  #
  # Histograms rather than sums, throughout. jvm.gc.duration already gives aggregate time spent in
  # GC; what no aggregate can give is the distribution of individual events, and a single 400ms
  # outlier is invisible in a total and obvious in a histogram. The same argument applies to
  # compaction: the mean compaction tells you much less than the shape.
  signal_to_metrics:
    logs:
      - name: cassandra.log.gc_event_duration_seconds
        description: Duration of one GCInspector event. See gc_name - Cycles lines are concurrent work, not pauses.
        unit: s
        conditions:
          - attributes["gc_event_ms"] != nil and resource.attributes["source"] == nil
        attributes:
          - key: gc_name
        histogram:
          value: Double(attributes["gc_event_ms"]) / 1000

      - name: cassandra.log.compaction_duration_seconds
        description: Wall time of one compaction, as CompactionTask reports it.
        unit: s
        conditions:
          - attributes["compaction_ms"] != nil and resource.attributes["source"] == nil
        histogram:
          value: Double(attributes["compaction_ms"]) / 1000

      - name: cassandra.log.compaction_ratio
        description: Compacted size as a fraction of the original. Exposed nowhere else.
        unit: "1"
        conditions:
          - attributes["compaction_ratio_pct"] != nil and resource.attributes["source"] == nil
        histogram:
          value: Double(attributes["compaction_ratio_pct"]) / 100

      - name: cassandra.log.compaction_sstables_merged
        description: SSTables merged by one compaction.
        unit: "{sstable}"
        conditions:
          - attributes["compaction_sstables"] != nil and resource.attributes["source"] == nil
        histogram:
          value: Double(attributes["compaction_sstables"])

      # Dropped messages. Sums, not histograms: each line reports a count for a 5-second window, so
      # adding them up is the total dropped. The latencies are means over that window, and their
      # distribution is what says whether drops were a brief spike or a sustained condition.
      - name: cassandra.log.dropped_messages_internal
        description: Messages dropped inside this node, by verb.
        unit: "{message}"
        conditions:
          - attributes["dropped_internal"] != nil and resource.attributes["source"] == nil
        attributes:
          - key: dropped_type
        sum:
          value: Double(attributes["dropped_internal"])

      - name: cassandra.log.dropped_messages_cross_node
        description: Messages dropped in transit from a peer, by verb.
        unit: "{message}"
        conditions:
          - attributes["dropped_cross_node"] != nil and resource.attributes["source"] == nil
        attributes:
          - key: dropped_type
        sum:
          value: Double(attributes["dropped_cross_node"])

      - name: cassandra.log.dropped_message_internal_latency_seconds
        description: Mean latency of internally dropped messages over a 5s window, by verb.
        unit: s
        conditions:
          - attributes["dropped_internal_ms"] != nil and resource.attributes["source"] == nil
        attributes:
          - key: dropped_type
        histogram:
          value: Double(attributes["dropped_internal_ms"]) / 1000

      - name: cassandra.log.dropped_message_cross_node_latency_seconds
        description: Mean latency of cross-node dropped messages over a 5s window, by verb.
        unit: s
        conditions:
          - attributes["dropped_cross_node_ms"] != nil and resource.attributes["source"] == nil
        attributes:
          - key: dropped_type
        histogram:
          value: Double(attributes["dropped_cross_node_ms"]) / 1000

  # Converts spans to Prometheus metrics (calls_total, latency histograms).
  # Exemplars link metric data points back to individual traces in Tempo.
  span_metrics:
    namespace: traces.spanmetrics
    histogram:
      explicit:
        buckets: [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1400ms, 2s, 5s, 10s]
    dimensions:
      - name: http.method
      - name: http.route
      - name: http.status_code
      - name: db.system
    exemplars:
      enabled: true
    metrics_flush_interval: 15s
    resource_metrics_key_attributes:
      - service.name
  # Derives service-to-service call rate and latency metrics from trace parent/child relationships.
  service_graph:
    latency_histogram_buckets: [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1400ms, 2s, 5s, 10s]
    dimensions:
      - http.method
      - http.status_code
    store:
      ttl: 2s
      max_items: 1000
    # Unset, the connector flushes once a minute (its 60s default): a rate() over Grafana's
    # default $__rate_interval then holds a single sample and the service-graph panels go blank.
    # 15s is the cadence of span_metrics and the Prometheus scrapes above.
    metrics_flush_interval: 15s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    # Metrics this collector scrapes itself: the kubelet's stats, pod-discovered backends and kits,
    # and static kit NodePorts at the node IP. resource/host_name stamps this node's name,
    # k8s_attributes adds the pod labels of scraped kit pods, and transform/node_role_from_host
    # derives any node_role still unset from the host. Host metrics arrive from the host add-on over
    # OTLP, in metrics/otlp.
    metrics/local:
      receivers: [kubelet_stats, prometheus]
      processors: [resource/cluster, resource/host_name, k8s_attributes, transform/node_role_from_host, batch]
      exporters: [prometheus_remote_write]
    # OTLP metrics — the Cassandra JVM agent, the stress sidecar, Spark nodes, and everything the
    # host add-on forwards (host metrics, Beyla, ebpf_exporter, Cilium). resource/cluster stamps the
    # cluster label to match local metrics; resource/drop_sdk_metadata removes the SDK's default
    # resource, which would otherwise ride along as fifteen labels per series. The EMR nodes'
    # host.name survives resource/host_name through transform/keep_emr_host and
    # transform/restore_emr_host. The host add-on forwards to the core on its own node
    # (internalTrafficPolicy: Local), so resource/host_name leaves its host.name unchanged.
    metrics/otlp:
      receivers: [otlp]
      processors: [resource/cluster, transform/keep_emr_host, resource/host_name, transform/restore_emr_host, resource/drop_sdk_metadata, batch]
      exporters: [prometheus_remote_write]
__POD_LOG_PIPELINE__
    # OTLP logs — the Cassandra JVM agent (the only path for Cassandra's application logs), Fluent
    # Bit's journald lines and the host add-on's host log files (system, tools, the Cassandra GC
    # log). Each host file source sets `source` on the resource, and the count and signal_to_metrics
    # connectors ignore any record that carries one, so a forwarded host line is never counted as a
    # Cassandra log record. resource/drop_sdk_metadata
    # matters even more here than on metrics: process.command_line is kilobytes of argv on EVERY
    # record, so it would bloat every stored line and change on a `cassandra use`.
    # transform/source_to_resource lifts journald's `source` onto the resource so Loki indexes it.
    # transform/log_metric_labels must run before the count connector, which reads the attributes it
    # writes.
    logs/otlp:
      receivers: [otlp]
      processors: [resource/cluster, resource/drop_sdk_metadata, transform/source_to_resource, transform/log_metric_labels, batch]
      exporters: [otlp_http/logs, count, signal_to_metrics]
    # Metrics derived from those logs. resource/cluster stamps the cluster label, as on every other
    # metrics pipeline.
    metrics/logs:
      receivers: [count, signal_to_metrics]
      processors: [resource/cluster, delta_to_cumulative, batch]
      exporters: [prometheus_remote_write]
    # resource/cluster here rather than in each span producer's own resource attributes. Any
    # producer gets the cluster label for free — the stress job today, Beyla or a future client
    # tomorrow — and it is the same mechanism every metrics pipeline already uses.
    traces:
      receivers: [otlp, jaeger]
      processors: [resource/cluster, batch]
      exporters: [otlp_grpc/tempo, span_metrics, service_graph]
    # The span_metrics connector keeps the span's resource on the metrics it derives.
    # resource_metrics_key_attributes ([service.name]) only chooses which attributes group spans
    # into one set of derived metrics; that set carries the whole resource of a span in the group
    # (host.name and argv included, as seen live), not service.name alone. resource/cluster is
    # re-applied so span-derived metrics are stamped from ${env:CLUSTER_NAME} by the same processor
    # as every other metrics pipeline, whatever the producer's resource carried.
    # resource/drop_sdk_metadata because that resource includes the SDK metadata, argv among it;
    # the traces themselves keep it in Tempo.
    metrics/spanmetrics:
      receivers: [span_metrics]
      processors: [resource/cluster, resource/drop_sdk_metadata, batch]
      exporters: [prometheus_remote_write]
    # The service_graph connector emits on an EMPTY resource: it keeps none of the spans'. Every
    # node runs this collector, and each counts the edges of the spans it receives (a database edge
    # is complete from one client span, so no edge is split). Without resource/host_name
    # the db nodes' collectors wrote one series together, and Mimir read the jumps between writers
    # as counter resets. Dashboards sum by (client, server) across hosts.
    metrics/servicegraph:
      receivers: [service_graph]
      processors: [resource/cluster, resource/host_name, batch]
      exporters: [prometheus_remote_write]
