# Native multi-tenancy: every write and query carries the cluster's tenant in X-Scope-OrgID.
multitenancy_enabled: true

# Pure v2 storage. The default, v1-v2-dual, writes every profile twice.
architecture_storage: v2

# The account bucket, under the pyroscope root. Pyroscope v2 lays out its own directories
# (segments, blocks) under this prefix. Nothing is written to the cluster's data bucket.
storage:
  backend: s3
  prefix: __PROFILES_S3_PREFIX__
  s3:
    bucket_name: __ACCOUNT_BUCKET__
    endpoint: s3.__AWS_REGION__.amazonaws.com
    region: __AWS_REGION__

# The metastore holds the only index of the blocks this cluster wrote; v2 cannot rebuild it from
# S3. Its data and Raft state live on the control node's disk (/data is a hostPath), so a pod
# restart keeps every profile queryable.
#
# NEVER delete a profile by age: the index cleanup that drives v2 retention is off. v2 compaction
# stays on: it merges this cluster's segments into blocks and keeps their data.
# Shutdown: after SIGTERM, Pyroscope 2.3.1 keeps its HTTP port open while its segment writer is
# already gone, so every push is refused for as long as the process waits to exit. The Java agent
# treats that answer (422) as permanent and drops the snapshot, so a restart lost about 30s of
# profiles. Each min_ready_duration below is also a wait at shutdown: the segment writer's 30s
# and the metastore's 15s. At 0s, and with usage reporting off (its 15s stop wait is the last one),
# the process exits within seconds of SIGTERM and the agent gets connection refused, which it
# retries; PyroscopeAgentReplayIntegrationTest finds no dropped upload in the agent's log across a
# restart. /ready still passes only once every module is up.
metastore:
  min_ready_duration: 0s
  data_dir: /data/metastore/data
  raft:
    dir: /data/metastore/raft
    snapshots_dir: /data/metastore/raft
  index:
    cleanup_interval: 0s

# Restart: without a tokens file the segment writer joins its ring again with no tokens, and the
# distributor caches that empty ring for its 5s refresh, so for about 5.5s after start every push is
# refused (422), which the Java agent drops. Keeping the tokens on the data volume, which survives a
# pod restart, leaves only a race: the port opens about 20ms before the tokens are read, and an
# agent that pushes in that instant loses that one snapshot.
#
# Shutdown: the HTTP server closes only after every other module has stopped. The segment writer
# stops within a millisecond of SIGTERM, so until the port closes every push is refused (422
# "service is unavailable") and the Java agent drops it. Three modules held the port open; the
# settings below bound each one. With them the port closed 8-248ms after SIGTERM over 40 bare
# stops on EC2 (2 under 100ms, 38 at 100-248ms).
#
# The ring store is in-process (`inmemory`): this server runs as one replica, so the ring never
# leaves the process. On memberlist, 8-12% of stops held the port 1s more: the LEAVING update
# fell in the same wall-clock second as the last heartbeat, the ring merge (one-second
# timestamps) saw no change, and dskit slept `noChangeDetectedRetrySleep` (1s,
# kv/memberlist/memberlist_client.go, KV.CAS) before it retried. The in-process store wakes its
# watchers every 100ms (kv/consul/mock.go, maxWaitTime), so the ring module stops within 100ms.
# The tokens still come from tokens_file_path, so a restart rejoins with them.
segment_writer:
  lifecycler:
    min_ready_duration: 0s
    tokens_file_path: /data/segment-writer-tokens
    ring:
      kvstore:
        store: inmemory

# The compaction worker stops only on its next poll tick (default 5s), so the poll runs every
# 100ms. Each tick costs two metastore Raft commands and one INFO line ("polling compaction jobs",
# about 150 bytes, 864,000 a day); the node collector drops that one line before Loki
# (filter/pyroscope_poll in otel-collector-config.yaml).
#
# request_timeout bounds a poll still in flight when the metastore stops: its client retried
# "raft is already shutdown" about every 90ms and gave up only after 50 tries, which held the port
# 4.3s in 2 of 40 stops at the 5s default. At 250ms the worst stop was 248ms; at 1s one stop took
# 997ms. The same timeout bounds a job's block metadata fetch, and a timeout there loses nothing
# (Pyroscope 2.3.1 source):
# 1. runCompaction (pkg/compactionworker/worker.go) fetches the metadata before it reads or writes
#    any block, and returns on an error with job.compacted unset: "the job is not failed, but just
#    abandoned - another worker will pick it up and try again".
# 2. collectUpdates (same file) sends no status for a done job with no compacted result ("skipping
#    update for abandoned job"), so its lease is not renewed.
# 3. The scheduler reassigns the job when its lease (compaction_job_lease_duration, 15s) expires
#    and counts one failure (isAbandoned and assignJob, pkg/metastore/compaction/scheduler/schedule.go).
# 4. After compaction_max_failures (3) the job is no longer assigned (isFailed, same file). Its
#    source blocks stay in the index uncompacted, and queries still read them.
# Both calls go to the metastore in this process and take milliseconds.
compaction_worker:
  job_poll_interval: 100ms
  request_timeout: 250ms

# Anonymous usage reporting to Grafana Labs. Its module stops last and holds shutdown 15s.
analytics:
  reporting_enabled: false

self_profiling:
  disable_push: true

limits:
  # 0 means data is never deleted (the v2.2+ default is 31 days).
  retention_period: 0s
  max_label_names_per_series: 30
  # One eBPF profile holds one sample per distinct stack in its window, so its sample count is at
  # most sample_rate (97 Hz) x collect_interval (15 s) x vCPUs, from config.alloy: 1,455 per vCPU.
  # The default of 16,000 is 11 busy vCPUs; edbl-ab1172 (64 vCPUs) sent 18,995 and lost every
  # data-node profile. 300,000 covers a 192-vCPU node with every tick on a distinct stack.
  max_profile_stacktrace_samples: 300000
  # The uncompressed size cap must let a profile at the sample limit through: 256 bytes a sample
  # (a 60-frame pprof measures 226) gives 80 MiB. It stays under Pyroscope's 100 MiB gRPC message
  # cap, because the distributor forwards each profile to the segment writer in one message.
  # Measured on 2.3.1: one 300,000-sample push peaks at about 1.5 GiB of heap, freed after the push.
  max_profile_size_bytes: 83886080
  ingestion_rate_mb: 16
  # The distributor's token bucket rejects any push larger than the burst, so the burst must hold
  # the largest profile allowed above. The sustained rate stays at 16 MB/s.
  ingestion_burst_size_mb: 128

server:
  http_listen_port: 4040
