# The Pyroscope pod's front: it takes every request on the Service port and passes it to the server on
# the pod's loopback unchanged, with one exception. From SIGTERM until it exits, Pyroscope 2.x keeps
# its port open with its distributor already stopped and answers every push 422 "service is
# unavailable". The Java agent retries only a 429 or a 5xx, so it dropped those profiles; the front
# answers that one reply 503 instead, which every client retries. It matches the refusal by how
# Pyroscope ends that JSON body, the wrapped gRPC error `rpc error: code = Unavailable desc = service
# is unavailable"}`, not by the phrase anywhere, so every other 422 (a profile Pyroscope cannot
# parse) and every other answer passes through as the server sent it. While the server container is
# down and the pod is up, the front cannot connect and answers 503 too.
global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout http-keep-alive 2m

frontend pyroscope
    bind :__FRONT_PORT__
    default_backend server
    http-response wait-for-body time 1s if { status 422 }
    http-response set-status 503 if { status 422 } { res.body -m reg 'rpc error: code = Unavailable desc = service is unavailable"}[[:space:]]*$' }

backend server
    server pyroscope 127.0.0.1:__SERVER_PORT__
