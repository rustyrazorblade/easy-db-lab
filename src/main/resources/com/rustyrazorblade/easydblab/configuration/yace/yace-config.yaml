apiVersion: v1alpha1
discovery:
  exportedTagsOnMetrics:
    AWS/S3:
      - BucketName
    AWS/EBS:
      - VolumeId
    AWS/EC2:
      - Name
    AWS/ES:
      - DomainName
  # Every cluster runs its own YACE and labels what it finds with its own cluster, so the
  # per-cluster jobs (EBS, EC2, OpenSearch) find only resources tagged with this cluster's
  # ClusterId; `up` tags instances, their volumes and the OpenSearch domain with it. The S3 job
  # stays on easy_cass_lab=1: the account bucket is shared and carries no ClusterId.
  jobs:
    - type: AWS/S3
      regions:
        - __AWS_REGION__
      period: 60
      length: 600
      delay: 300
      searchTags:
        - key: easy_cass_lab
          value: "1"
      metrics:
        - name: BucketSizeBytes
          statistics: [Average]
          period: 86400
          length: 172800
        - name: NumberOfObjects
          statistics: [Average]
          period: 86400
          length: 172800
        - name: BytesDownloaded
          statistics: [Sum]
        - name: BytesUploaded
          statistics: [Sum]
        - name: GetRequests
          statistics: [Sum, Average]
        - name: PutRequests
          statistics: [Sum, Average]
        - name: FirstByteLatency
          statistics: [Average, p99]
        - name: TotalRequestLatency
          statistics: [Average, p99]
    - type: AWS/EBS
      regions:
        - __AWS_REGION__
      period: 60
      length: 600
      delay: 300
      searchTags:
        - key: easy_cass_lab
          value: "1"
        - key: ClusterId
          value: "__CLUSTER_ID__"
      metrics:
        - name: VolumeReadOps
          statistics: [Sum]
        - name: VolumeWriteOps
          statistics: [Sum]
        - name: VolumeReadBytes
          statistics: [Sum]
        - name: VolumeWriteBytes
          statistics: [Sum]
        - name: VolumeTotalReadTime
          statistics: [Sum]
        - name: VolumeTotalWriteTime
          statistics: [Sum]
        - name: VolumeQueueLength
          statistics: [Average]
        - name: BurstBalance
          statistics: [Average]
    - type: AWS/EC2
      regions:
        - __AWS_REGION__
      period: 60
      length: 600
      delay: 300
      searchTags:
        - key: easy_cass_lab
          value: "1"
        - key: ClusterId
          value: "__CLUSTER_ID__"
      metrics:
        - name: CPUUtilization
          statistics: [Average]
        - name: NetworkIn
          statistics: [Sum]
        - name: NetworkOut
          statistics: [Sum]
        - name: DiskReadOps
          statistics: [Sum]
        - name: DiskWriteOps
          statistics: [Sum]
    - type: AWS/ES
      regions:
        - __AWS_REGION__
      period: 60
      length: 600
      delay: 300
      searchTags:
        - key: easy_cass_lab
          value: "1"
        - key: ClusterId
          value: "__CLUSTER_ID__"
      metrics:
        - name: ClusterStatus.green
          statistics: [Maximum]
        - name: ClusterStatus.yellow
          statistics: [Maximum]
        - name: ClusterStatus.red
          statistics: [Maximum]
        - name: CPUUtilization
          statistics: [Average]
        - name: JVMMemoryPressure
          statistics: [Maximum]
        - name: FreeStorageSpace
          statistics: [Minimum]
        - name: SearchLatency
          statistics: [Average]
        - name: SearchRate
          statistics: [Average]
        - name: IndexingLatency
          statistics: [Average]
        - name: IndexingRate
          statistics: [Average]
        - name: Nodes
          statistics: [Average]
