name: kafka
type: db
description: Apache Kafka in KRaft mode via Strimzi operator (quay.io/strimzi — Apache 2.0)
version: "2.0.0"
collision-check: true
metrics:
  # Pod discovery, so each pod is scraped once, by the collector on its own node, with
  # instance = the pod name. Static jobs on the metrics NodePorts (32309, 32404) were run by
  # every collector, duplicating the series once per node. Ports are the containers' metrics
  # port; the selectors are the ones Strimzi's pods carry (and the NodePort Services use).
  - type: scrape
    port: 9404
    path: /metrics
    job: kafka-exporter
    pod-selector: "strimzi.io/cluster=kafka,app.kubernetes.io/name=kafka-exporter"
  - type: scrape
    port: 9404
    path: /metrics
    job: kafka-jmx
    pod-selector: "strimzi.io/cluster=kafka,strimzi.io/broker-role=true"
# The Kafka cluster's own pods, which `start` creates and `stop` removes. Strimzi labels every pod
# of the `kafka` Kafka resource with strimzi.io/cluster=kafka. The strimzi-operator helm release is
# installed by `install` and outlives `stop`, so it cannot say whether Kafka is running.
runtime:
  type: pods
  selector: "strimzi.io/cluster=kafka"
  namespace: default
# Strimzi creates the Services of the Kafka resource's listeners, so no manifest of this kit declares
# them: `<cluster>-kafka-bootstrap` for the internal `plain` listener and
# `<cluster>-kafka-<listener>-bootstrap` for the `external` nodeport one. A port-forward targets them.
endpoints:
  - name: "Kafka Internal"
    node-type: db
    port: 9092
    type: kafka
    service: kafka-kafka-bootstrap
    service-port: 9092
  - name: "Kafka Bootstrap"
    node-type: db
    port: 32100
    type: kafka
    service: kafka-kafka-external-bootstrap
    service-port: 9094
args:
  - flag: --version
    variable: KAFKA_VERSION
    description: "Kafka version (e.g. 4.0.0)"
    type: string
    default: "4.2.0"
  - flag: --brokers
    variable: BROKERS
    description: "Number of broker/controller nodes"
    type: int
    default: "1"
  - flag: --storage-size
    variable: STORAGE_SIZE
    description: "Persistent volume size per broker"
    type: string
    default: "${KIT_STORAGE_SIZE}"

commands:
  producer-perf:
    description: "Run Kafka producer performance test"
    args:
      - flag: --num-records
        variable: NUM_RECORDS
        description: "Number of records to produce"
        type: int
        default: "1000000"
      - flag: --record-size
        variable: RECORD_SIZE
        description: "Record size in bytes"
        type: int
        default: "1024"
      - flag: --throughput
        variable: THROUGHPUT
        description: "Target throughput in msg/sec (-1 for unlimited)"
        type: int
        default: "1000"
      - flag: --topic
        variable: TOPIC
        description: "Topic to produce to"
        type: string
        default: "perf-test"
  consumer-perf:
    description: "Run Kafka consumer performance test"
    args:
      - flag: --num-records
        variable: NUM_RECORDS
        description: "Number of records to consume"
        type: int
        default: "1000000"
      - flag: --topic
        variable: TOPIC
        description: "Topic to consume from"
        type: string
        default: "perf-test"
      - flag: --group
        variable: GROUP
        description: "Consumer group ID"
        type: string
        default: "bench-consumer"
  create-topic:
    description: "Create a Kafka topic"
    args:
      - flag: --topic
        variable: TOPIC
        description: "Topic name"
        type: string
        default: "perf-test"
      - flag: --partitions
        variable: PARTITIONS
        description: "Number of partitions"
        type: int
        default: "3"
      - flag: --replication-factor
        variable: REPLICATION_FACTOR
        description: "Replication factor"
        type: int
        default: "1"

install:
  - type: helm-repo
    name: strimzi
    url: https://strimzi.io/charts/
  - type: helm
    chart: strimzi/strimzi-kafka-operator
    release: strimzi-operator
    namespace: strimzi
    values:
      watchNamespaces: "{default}"
  - type: wait
    kind: deployment
    name: strimzi-cluster-operator
    namespace: strimzi
    condition: Available
    timeout: 300s
  - type: kit-storage
    node-type: db
    volume-claim-template-name: data-0

start:
  - type: manifest
    template: kafka-metrics-config.yaml
  # The brokers' volumes outlive stop (deleteClaim: false) and record the KRaft cluster ID in
  # meta.properties, but a new Kafka resource gets a new ID, and a broker refuses a volume of
  # another cluster. After a stop, the ID it saved goes back into the new resource's status before
  # Strimzi first reconciles it: apply paused, wait for the pause, patch the status, resume
  # (Strimzi's recovery of a KRaft cluster from persistent volumes). A first start just applies.
  - type: shell
    script: |
      set -euo pipefail
      CLUSTER_ID_FILE=kafka-cluster-id
      if [ ! -s "$CLUSTER_ID_FILE" ]; then
        kubectl apply -f kafka.yaml --namespace default
        exit 0
      fi
      CLUSTER_ID=$(cat "$CLUSTER_ID_FILE")
      echo "Restoring KRaft cluster ID $CLUSTER_ID saved by the last stop"
      kubectl annotate --local -f kafka.yaml strimzi.io/pause-reconciliation=true -o yaml > kafka-paused.yaml
      kubectl apply -f kafka-paused.yaml --namespace default
      # By jsonpath, not --for=condition: a paused Kafka keeps status.observedGeneration at 0, and
      # kubectl's condition wait accepts a condition only once that matches metadata.generation.
      kubectl wait kafka/kafka --namespace default \
        --for=jsonpath='{.status.conditions[?(@.type=="ReconciliationPaused")].status}'=True --timeout=300s
      kubectl patch kafka kafka --namespace default --subresource status --type merge \
        -p "{\"status\":{\"clusterId\":\"$CLUSTER_ID\"}}"
      kubectl annotate kafka/kafka kafkanodepool/dual-role --namespace default strimzi.io/pause-reconciliation-
  - type: wait
    kind: kafka
    name: kafka
    condition: Ready
    timeout: 300s
  - type: manifest
    template: kafka-exporter-nodeport.yaml
  - type: manifest
    template: kafka-broker-jmx-nodeport.yaml

stop:
  # The Kafka resource's status holds the KRaft cluster ID the kept volumes record; start puts it
  # back. A resource with no ID (never reconciled) leaves the last saved one in place. uninstall
  # removes the kit directory, and the file with it.
  - type: shell
    script: |
      set -euo pipefail
      CLUSTER_ID=$(kubectl get kafka kafka --namespace default --ignore-not-found -o jsonpath='{.status.clusterId}')
      if [ -n "$CLUSTER_ID" ]; then
        printf '%s\n' "$CLUSTER_ID" > kafka-cluster-id
        echo "Saved KRaft cluster ID $CLUSTER_ID for the next start"
      fi
  - type: delete
    kind: kafka
    name: kafka
  - type: delete
    kind: kafkanodepool
    name: dual-role
  - type: delete
    kind: service
    name: kafka-exporter-nodeport
  - type: delete
    kind: service
    name: kafka-broker-jmx-nodeport

uninstall:
  - type: delete
    kind: kafka
    name: kafka
    ignore-not-found: true
  - type: delete
    kind: kafkanodepool
    name: dual-role
    ignore-not-found: true
  - type: delete
    kind: configmap
    name: kafka-metrics-config
    ignore-not-found: true
  - type: delete
    kind: service
    name: kafka-exporter-nodeport
    ignore-not-found: true
  - type: delete
    kind: service
    name: kafka-broker-jmx-nodeport
    ignore-not-found: true
  - type: shell
    script: |
      kubectl delete pvc -l strimzi.io/cluster=kafka --namespace default --ignore-not-found=true
  - type: kit-storage-delete
    node-type: db
  - type: helm-uninstall
    release: strimzi-operator
    namespace: strimzi
