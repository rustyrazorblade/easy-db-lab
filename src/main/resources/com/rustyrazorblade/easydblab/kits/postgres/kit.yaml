name: postgres
type: db
description: Deploy PostgreSQL via the CloudNativePG operator
version: "1.0.0"
collision-check: true
metrics:
  # Pod discovery on this instance's primary, the pod the metrics NodePort selected, scraped once
  # by the collector on its node with instance = the pod name. A static job on the NodePort was
  # run by every collector, duplicating the series once per node. Port is CNPG's metrics
  # container port, the same for every instance; ${KIT_NAME} is the instance name.
  - type: scrape
    port: 9187
    path: /metrics
    job: postgres
    pod-selector: "cnpg.io/cluster=${KIT_NAME},cnpg.io/instanceRole=primary"
runtime:
  type: pods
  # Scoped to this instance: postgres and postgres-<extension> run side by side, and the start
  # collision check must not mistake one for the other. CNPG labels each instance pod with its
  # Cluster, which is named after the kit instance.
  selector: "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance"
  namespace: default
endpoints:
  - name: "PostgreSQL"
    node-type: db
    port: 30432
    type: postgresql
    database: postgres
  - name: "JDBC"
    node-type: db
    port: 30432
    type: jdbc
    scheme: postgresql
    path: /postgres
args:
  - flag: --version
    variable: POSTGRES_VERSION
    description: "PostgreSQL major version (e.g. 17, 16)"
    type: string
    default: "17"
  - flag: --instances
    variable: INSTANCES
    description: "Number of PostgreSQL instances (1 = single node, >1 enables replication)"
    type: int
    default: "1"
  - flag: --size
    variable: STORAGE_SIZE
    description: Storage size per node (e.g. 100Gi)
    type: string
    default: "10Ti"
  - flag: --extension
    variable: EXTENSION
    description: "Extension alias to activate (e.g. duckdb, postgis, timescaledb). Run 'postgres extensions' to list available aliases."
    type: extension
    default: ""

install:
  - type: helm-repo
    name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - type: helm
    chart: cnpg/cloudnative-pg
    release: cnpg-operator
    namespace: cnpg-system

start:
  - type: platform-pvs
    node-type: db
  - type: manifest
    template: postgres-cluster.yaml
  - type: shell
    script: |
      echo "Waiting for PostgreSQL instance pods to be created..."
      # Scoped to this instance's Cluster: postgres and postgres-<extension> run side by side.
      until kubectl get pods -l "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance" -n default --no-headers 2>/dev/null | grep -q .; do sleep 5; done
      echo "Pods found, waiting for Ready..."
      kubectl wait --for=condition=Ready pods \
        -l "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance" \
        --namespace default \
        --timeout=300s
  - type: manifest
    template: nodeport-service.yaml

stop:
  - type: delete
    kind: Cluster
    name: ${KIT_NAME}
    namespace: default
  - type: delete
    kind: Service
    name: ${KIT_NAME}-nodeport
    namespace: default
  - type: delete
    kind: Secret
    name: ${KIT_NAME}-credentials
    namespace: default
  - type: delete
    kind: ImageCatalog
    name: ${KIT_NAME}-catalog
    namespace: default

uninstall:
  - type: platform-pvs-delete
  # postgres and every postgres-<extension> instance run on this one operator; it is removed only
  # once no CNPG Cluster is left.
  - type: helm-uninstall
    release: cnpg-operator
    namespace: cnpg-system
    keep-while-any: clusters.postgresql.cnpg.io

capabilities:
  - type: sql
    user: postgres
