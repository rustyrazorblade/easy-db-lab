name: postgres
type: db
description: Deploy PostgreSQL via the CloudNativePG operator
version: "1.0.0"
collision-check: true
metrics:
  # Pod discovery on this instance's primary, the pod the metrics NodePort selected, scraped once
  # by the collector on its node with instance = the pod name. A static job on the NodePort was
  # run by every collector, duplicating the series once per node. Port is CNPG's metrics
  # container port, the same for every instance; ${KIT_NAME} is the instance name. No fixed job:
  # the job is the instance name (postgres, postgres-duckdb, ...), as for every other kit.
  - type: scrape
    port: 9187
    path: /metrics
    pod-selector: "cnpg.io/cluster=${KIT_NAME},cnpg.io/instanceRole=primary"
# Every instance installs the overview; an extension instance adds only its own extension's
# dashboard. An instance other than plain postgres installs them under uids of its own, so it
# never moves plain postgres's dashboards into its folder.
dashboards:
  - path: dashboards/postgres.json
  - path: dashboards/duckdb.json
    extension: duckdb
  - path: dashboards/postgis.json
    extension: postgis
  - path: dashboards/timescaledb.json
    extension: timescaledb
runtime:
  type: pods
  # Scoped to this instance: postgres and postgres-<extension> run side by side, and the start
  # collision check must not mistake one for the other. CNPG labels each instance pod with its
  # Cluster, which is named after the kit instance.
  selector: "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance"
  namespace: default
endpoints:
  - name: "PostgreSQL"
    node-type: db
    port: 30432
    type: postgresql
    database: postgres
  - name: "JDBC"
    node-type: db
    port: 30432
    type: jdbc
    scheme: postgresql
    path: /postgres
args:
  - flag: --version
    variable: POSTGRES_VERSION
    description: "PostgreSQL major version (e.g. 17, 16)"
    type: string
    default: "17"
  - flag: --instances
    variable: INSTANCES
    description: "Number of PostgreSQL instances (1 = single node, >1 enables replication)"
    type: int
    default: "1"
  - flag: --size
    variable: STORAGE_SIZE
    description: Storage size per node (e.g. 100Gi)
    type: string
    default: "10Ti"
  - flag: --extension
    variable: EXTENSION
    description: "Extension alias to activate (e.g. duckdb, postgis, timescaledb). Run 'postgres extensions' to list available aliases."
    type: extension
    default: ""

install:
  - type: helm-repo
    name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - type: helm
    chart: cnpg/cloudnative-pg
    release: cnpg-operator
    namespace: cnpg-system

start:
  - type: platform-pvs
    node-type: db
  - type: manifest
    template: postgres-cluster.yaml
  - type: shell
    script: |
      echo "Waiting for PostgreSQL instance pods to be created..."
      # Scoped to this instance's Cluster: postgres and postgres-<extension> run side by side.
      until kubectl get pods -l "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance" -n default --no-headers 2>/dev/null | grep -q .; do sleep 5; done
      echo "Pods found, waiting for Ready..."
      kubectl wait --for=condition=Ready pods \
        -l "cnpg.io/cluster=${KIT_NAME},cnpg.io/podRole=instance" \
        --namespace default \
        --timeout=300s
  - type: manifest
    template: nodeport-service.yaml

stop:
  # CNPG bootstraps (initdb) any Cluster it has not seen, and moves an existing PGDATA aside to do
  # it, so stop never deletes the Cluster. Hibernation removes the instance pods and keeps the
  # Cluster, its status and its claims; start applies the Cluster with hibernation off. The Secret
  # and ImageCatalog the Cluster references stay too; start applies all three again.
  - type: shell
    script: |
      set -euo pipefail
      if [ -n "$(kubectl get cluster.postgresql.cnpg.io "${KIT_NAME}" -n default --ignore-not-found -o name)" ]; then
        kubectl annotate cluster.postgresql.cnpg.io "${KIT_NAME}" -n default --overwrite cnpg.io/hibernation=on
      fi
  - type: delete
    kind: Service
    name: ${KIT_NAME}-nodeport
    namespace: default

uninstall:
  # The one phase that deletes the dataset: the Cluster, then its claims (CNPG deletes them with
  # the Cluster; this removes any it left), then the credentials, the catalog and the storage.
  - type: delete
    kind: cluster.postgresql.cnpg.io
    name: ${KIT_NAME}
    namespace: default
  - type: delete
    kinds: [pvc]
    selector: cnpg.io/cluster=${KIT_NAME}
    namespace: default
  - type: delete
    kind: Secret
    name: ${KIT_NAME}-credentials
    namespace: default
  - type: delete
    kind: ImageCatalog
    name: ${KIT_NAME}-catalog
    namespace: default
  - type: platform-pvs-delete
  # postgres and every postgres-<extension> instance run on this one operator; it is removed only
  # once no CNPG Cluster is left.
  - type: helm-uninstall
    release: cnpg-operator
    namespace: cnpg-system
    keep-while-any: clusters.postgresql.cnpg.io

capabilities:
  - type: sql
    user: postgres
