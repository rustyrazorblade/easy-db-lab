name: presto
type: app
description: Scaffold Presto workload files (stateless, targets app nodes)
collision-check: false
metrics:
  - type: scrape
    port: 9090
    # Pod discovery, so only the collector on the pod's own node scrapes it. A static job
    # would have every collector scrape localhost:9090, and every node without the pod
    # would report the job down.
    pod-selector: "app.kubernetes.io/name=presto,app.kubernetes.io/component=coordinator"
runtime:
  type: helm
  release: presto
  namespace: default
# The coordinator serves 8080 as a hostPort, so only its own node answers; the scheduler can put
# it on any app node. Both endpoints name its pod, so sql, TARGET_* and every status display use
# the node that runs it.
endpoints:
  - name: "Presto UI"
    node-type: app
    port: 8080
    type: http
    pod-selector: "app.kubernetes.io/name=presto,app.kubernetes.io/component=coordinator"
  - name: "JDBC"
    node-type: app
    port: 8080
    type: jdbc
    scheme: presto
    pod-selector: "app.kubernetes.io/name=presto,app.kubernetes.io/component=coordinator"
args:
  - flag: --workers
    variable: WORKERS
    description: "Number of Presto workers (default: app node count)"
    type: int
    default: "${APP_NODE_COUNT}"
hooks:
  post-workload-start:
    script: bin/update-catalogs.sh
  post-workload-stop:
    script: bin/update-catalogs.sh
capabilities:
  - type: sql
    user: easy-db-lab
    driver-class: com.facebook.presto.jdbc.PrestoDriver
