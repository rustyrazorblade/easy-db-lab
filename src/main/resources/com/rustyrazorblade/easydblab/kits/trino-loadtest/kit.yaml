name: trino-loadtest
type: app
description: Concurrent read-load driver against the Trino coordinator's cqlite catalog — install with --target to point at a running trino kit
version: "1.0.0"
collision-check: true

args:
  - flag: --target
    variable: TARGET
    type: kit-ref
    capability: sql
    description: "Name of the running trino kit to load-test (must expose an http endpoint on the app nodes)"
    required: true

commands:
  start:
    description: "Run the concurrent read-load driver against cqlite.<ks>.<tbl>. Fails before any pod runs unless the target Trino has a cqlite catalog, which the trino kit does not ship yet (pmcfadin/cqlite#2869)"
    args:
      - flag: --ks
        variable: TRINO_LOADTEST_KEYSPACE
        type: string
        description: "cqlite keyspace to query (ignored when --queries-file is set)"
        default: ""
      - flag: --tbl
        variable: TRINO_LOADTEST_TABLE
        type: string
        description: "cqlite table to query (ignored when --queries-file is set)"
        default: ""
      - flag: --queries-file
        variable: TRINO_LOADTEST_QUERIES_FILE
        type: string
        description: "Path on the control host to a file with one SQL query per line; overrides the built-in scan+aggregate default set"
        default: ""
      - flag: --threads
        variable: THREADS
        type: int
        description: "Number of concurrent persistent Trino connections"
        default: "4"
      - flag: --duration
        variable: DURATION
        type: int
        description: "Load duration in seconds"
        default: "60"
      - flag: --interval
        variable: INTERVAL
        type: int
        description: "Interval stats reporting period in seconds"
        default: "10"
      - flag: --traceparent
        variable: TRACEPARENT
        type: boolean
        description: "Attach a random W3C traceparent header to every query, for end-to-end Tempo traces (off by default)"
        default: "false"
      - flag: --snapshot-check-cmd
        variable: TRINO_LOADTEST_SNAPSHOT_CHECK_CMD
        type: string
        description: "Shell command run with bash on your machine (not in the driver pod) after the run, printing the raw `nodetool listsnapshots` output of every db node, e.g. \"for h in db0 db1 db2; do ssh $h nodetool listsnapshots; done\" (ssh goes through the workspace wrapper). Fails the run if any cqlite- snapshot remains. Do NOT pipe through grep: a non-zero exit fails the check. Unset: the check is skipped."
        default: ""
      # A string with no default, not an int: unset means "use the 60s default", which lives only
      # in lib/snapshot-check.sh, and start.sh rejects anything but a whole number above 0 with a
      # message naming this flag, before any pod runs.
      - flag: --snapshot-check-timeout-s
        variable: TRINO_LOADTEST_SNAPSHOT_CHECK_TIMEOUT_S
        type: string
        description: "Whole seconds to allow --snapshot-check-cmd to run before the check fails and its processes are killed (default 60). Ignored unless --snapshot-check-cmd is set."
        default: ""
