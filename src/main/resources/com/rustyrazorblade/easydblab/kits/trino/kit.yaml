name: trino
type: app
description: Scaffold Trino workload files (stateless, targets app nodes)
collision-check: false
metrics:
  - type: scrape
    port: 8080
    path: /metrics
    username: trino
    # Pod discovery, so only the collector on the pod's own node scrapes it. A static job
    # would have every collector scrape localhost:8080, and every node without the pod
    # would report the job down.
    pod-selector: "app.kubernetes.io/name=trino,app.kubernetes.io/component=coordinator"
runtime:
  type: helm
  release: trino
  namespace: default
# The coordinator serves 8080 as a hostPort, so only its own node answers; the scheduler can put
# it on any app node. Both endpoints name its pod, so sql, TARGET_* and every status display use
# the node that runs it.
endpoints:
  - name: "Trino UI"
    node-type: app
    port: 8080
    type: http
    pod-selector: "app.kubernetes.io/name=trino,app.kubernetes.io/component=coordinator"
  - name: "JDBC"
    node-type: app
    port: 8080
    type: jdbc
    scheme: trino
    pod-selector: "app.kubernetes.io/name=trino,app.kubernetes.io/component=coordinator"
args:
  - flag: --version
    variable: VERSION
    description: "Trino release version (e.g. 474, 469)"
    type: string
    default: "474"
  - flag: --workers
    variable: WORKERS
    description: "Number of Trino workers (default: app node count)"
    type: int
    default: "${APP_NODE_COUNT}"
hooks:
  post-workload-start:
    script: bin/update-catalogs.sh
  post-workload-stop:
    script: bin/update-catalogs.sh
capabilities:
  - type: sql
    user: trino
    driver-class: io.trino.jdbc.TrinoDriver
