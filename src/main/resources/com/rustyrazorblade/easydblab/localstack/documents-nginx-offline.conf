# The read-only documents web server of an opened export: the cluster's documents view, serving the
# reports the export copied from disk instead of from the account bucket.
#
# The export's data directory is mounted read-only at /data, so /reports/<tenant>/<experiment>/... is
# /data/reports/<tenant>/<experiment>/... Only GET requests for paths under /reports/ are served.
# nginx decodes and normalizes the path first, so /reports/../mimir/ is /mimir/ and is refused, and a
# decoded path must hold only the document name characters, as on a cluster.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen __DOCUMENTS_WEB_PORT__;
        root /data;
        index index.html;

        location /reports/ {
            if ($request_method != GET) {
                return 405;
            }
            if ($uri !~ "^/reports/[A-Za-z0-9._/-]+$") {
                return 400;
            }
            try_files $uri $uri/ =404;
        }

        location / {
            return 404;
        }
    }
}
