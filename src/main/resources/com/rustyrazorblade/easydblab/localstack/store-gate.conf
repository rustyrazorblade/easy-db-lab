# The local stack's read gate (store-gate).
#
# Every backend of the stack reaches the account bucket only through here. GET and HEAD pass, query
# string included (so bucket listings work), to the signer, which signs them with the operator's
# profile. Every other method gets 403 and never reaches S3: PUT, POST and DELETE, and with them
# multipart uploads and POST ?delete. Tempo's single binary tries to PUT its tenant index on every
# poll; this is what refuses it.
#
# Every request is logged to stdout; a refused one is logged a second time, on a line that starts
# with REFUSED, so `docker compose logs store-gate | grep REFUSED` lists every write a component tried.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $request_method $refused {
        GET 0;
        HEAD 0;
        default 1;
    }

    log_format gate '$time_iso8601 $remote_addr $request_method "$request_uri" $status';
    log_format refused 'REFUSED $time_iso8601 $remote_addr $request_method "$request_uri" $status';
    access_log /dev/stdout gate;
    access_log /dev/stdout refused if=$refused;

    server {
        listen __STORE_PORT__;
        client_max_body_size 0;

        location / {
            # GET implies HEAD; every other method is denied with 403.
            limit_except GET {
                deny all;
            }
            # No URI part: the request URI and its query string pass unchanged.
            proxy_pass http://__STORE_SIGNER__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
