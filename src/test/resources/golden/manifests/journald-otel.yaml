---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  labels:
    app.kubernetes.io/name: "fluent-bit-journald"
  name: "fluent-bit-journald-config"
  namespace: "default"
data:
  fluent-bit-journald.yaml: |
    service:
      flush: 5
      log_level: info
      http_server: true
      http_listen: 0.0.0.0
      http_port: 2020
      health_check: true
      # Retries back off exponentially up to this many seconds (default 2000), plus the one second
      # Fluent Bit adds to every retry delay, so 31s at most. At the default, a
      # chunk could wait many minutes after the collector came back, and arrive past Loki's 30-minute
      # out-of-order window or after `down` removed the collector (issue 991).
      scheduler.cap: 30

    pipeline:
      inputs:
        - name: systemd
          tag: journald
          path: /var/log/journal
          read_from_tail: true
          strip_underscores: true

      filters:
        # Drop noisy kernel apparmor audit messages — high volume, no diagnostic value
        - name: grep
          match: journald
          exclude: SYSLOG_IDENTIFIER kernel

        # Map severity, drop noise fields, rename for clarity
        - name: lua
          match: journald
          script: /fluent-bit/etc/severity-mapper.lua
          call: process

      outputs:
        # The node collector restarts on every kit start and stop, and its config roll can outlast
        # Fluent Bit's default of one retry. Retry without a limit so no journal line is dropped
        # (issue 991). Chunks stay in memory: there is no storage.path, by owner decision.
        - name: opentelemetry
          match: journald
          retry_limit: no_limits
          host: 127.0.0.1
          port: 4318
          logs_uri: /v1/logs
          tls: off
          logs_body_key: $MESSAGE
          logs_severity_text_message_key: $severity
          logs_body_key_attributes: true
  severity-mapper.lua: |
    -- Maps journald syslog PRIORITY to severity text and drops noise fields.
    -- Syslog: 0=emerg, 1=alert, 2=crit, 3=err, 4=warning, 5=notice, 6=info, 7=debug

    local KEEP = {
        MESSAGE = true,
        PRIORITY = true,
    }

    local SEVERITY = {
        ["0"] = "FATAL", ["1"] = "FATAL",
        ["2"] = "ERROR", ["3"] = "ERROR",
        ["4"] = "WARN",
        ["5"] = "INFO",  ["6"] = "INFO",
        ["7"] = "DEBUG",
    }

    -- Cassandra's logback lines reach Loki twice: once from the OTel Java agent, which adds
    -- severity, logger name and the resource labels, and once from this journal scrape, which adds
    -- none of that. Only the duplicate is dropped.
    --
    -- The unit is NOT excluded wholesale, and that is the point of doing this here rather than with a
    -- grep filter. Cassandra writes to the journal outside logback as well - JVM CompileCommand output
    -- at startup is visible on the nodes today, and a JVM crash, an OutOfMemoryError handler or
    -- anything logged before logback initialises would arrive the same way. The agent cannot see any of
    -- it, so the journal is the only path it has. Losing a crash log to save duplicate INFO lines is a
    -- bad trade.
    --
    -- A logback line is recognised by its leading level token. Everything else from the unit is kept.
    local function is_duplicate_of_agent(record)
        if record["SYSTEMD_UNIT"] ~= "cassandra.service" then
            return false
        end

        local message = record["MESSAGE"]
        if type(message) ~= "string" then
            return false
        end

        -- "INFO  [main] 2026-.. .." from Cassandra, "WARNING 2026-.. .." from the AxonOps agent.
        return string.match(message, "^%u%u+%s") ~= nil
    end

    function process(tag, timestamp, record)
        if is_duplicate_of_agent(record) then
            return -1, timestamp, record
        end

        local new = {}
        for k, v in pairs(record) do
            if KEEP[k] then new[k] = v end
        end
        local p = tostring(record["PRIORITY"] or "")
        new["severity"] = SEVERITY[p] or "INFO"
        new["service"] = record["SYSLOG_IDENTIFIER"] or ""
        new["systemd_unit"] = record["SYSTEMD_UNIT"] or ""
        new["source"] = "journald"
        new["host.name"] = record["HOSTNAME"] or ""
        return 1, timestamp, new
    end
---
---
apiVersion: "apps/v1"
kind: "DaemonSet"
metadata:
  labels:
    app.kubernetes.io/name: "fluent-bit-journald"
  name: "fluent-bit-journald"
  namespace: "default"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "fluent-bit-journald"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "fluent-bit-journald"
    spec:
      containers:
      - args:
        - "--config=/fluent-bit/etc/config.yaml"
        image: "fluent/fluent-bit:5.1.2"
        livenessProbe:
          httpGet:
            path: "/api/v1/health"
            port: 2020
          initialDelaySeconds: 10
          periodSeconds: 30
        name: "fluent-bit-journald"
        ports:
        - containerPort: 2020
          hostPort: 2020
          name: "http"
          protocol: "TCP"
        readinessProbe:
          httpGet:
            path: "/api/v1/health"
            port: 2020
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          capabilities:
            add:
            - "DAC_READ_SEARCH"
          runAsUser: 0
        volumeMounts:
        - mountPath: "/fluent-bit/etc/config.yaml"
          name: "config"
          readOnly: true
          subPath: "fluent-bit-journald.yaml"
        - mountPath: "/fluent-bit/etc/severity-mapper.lua"
          name: "config"
          readOnly: true
          subPath: "severity-mapper.lua"
        - mountPath: "/var/log/journal"
          name: "journal"
          readOnly: true
      dnsPolicy: "ClusterFirstWithHostNet"
      hostNetwork: true
      tolerations:
      - operator: "Exists"
      volumes:
      - configMap:
          name: "fluent-bit-journald-config"
        name: "config"
      - hostPath:
          path: "/var/log/journal"
          type: "Directory"
        name: "journal"
