---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  labels:
    app.kubernetes.io/name: "kube-state-metrics"
  name: "kube-state-metrics"
  namespace: "default"
---
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRole"
metadata:
  labels:
    app.kubernetes.io/name: "kube-state-metrics"
  name: "kube-state-metrics"
rules:
- apiGroups:
  - ""
  resources:
  - "configmaps"
  - "secrets"
  - "nodes"
  - "pods"
  - "services"
  - "serviceaccounts"
  - "resourcequotas"
  - "replicationcontrollers"
  - "limitranges"
  - "persistentvolumeclaims"
  - "persistentvolumes"
  - "namespaces"
  - "endpoints"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "apps"
  resources:
  - "statefulsets"
  - "daemonsets"
  - "deployments"
  - "replicasets"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "batch"
  resources:
  - "cronjobs"
  - "jobs"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "autoscaling"
  resources:
  - "horizontalpodautoscalers"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "policy"
  resources:
  - "poddisruptionbudgets"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "certificates.k8s.io"
  resources:
  - "certificatesigningrequests"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - "endpointslices"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "storage.k8s.io"
  resources:
  - "storageclasses"
  - "volumeattachments"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "admissionregistration.k8s.io"
  resources:
  - "mutatingwebhookconfigurations"
  - "validatingwebhookconfigurations"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "networking.k8s.io"
  resources:
  - "networkpolicies"
  - "ingressclasses"
  - "ingresses"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  verbs:
  - "list"
  - "watch"
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "clusterrolebindings"
  - "clusterroles"
  - "rolebindings"
  - "roles"
  verbs:
  - "list"
  - "watch"
---
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRoleBinding"
metadata:
  labels:
    app.kubernetes.io/name: "kube-state-metrics"
  name: "kube-state-metrics"
roleRef:
  kind: "ClusterRole"
  apiGroup: "rbac.authorization.k8s.io"
  name: "kube-state-metrics"
subjects:
- kind: "ServiceAccount"
  name: "kube-state-metrics"
  namespace: "default"
---
---
apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app.kubernetes.io/name: "kube-state-metrics"
  name: "kube-state-metrics"
  namespace: "default"
spec:
  ports:
  - name: "http-metrics"
    port: 8080
    protocol: "TCP"
    targetPort: 8080
  selector:
    app.kubernetes.io/name: "kube-state-metrics"
  type: "ClusterIP"
---
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app.kubernetes.io/name: "kube-state-metrics"
  name: "kube-state-metrics"
  namespace: "default"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "kube-state-metrics"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "kube-state-metrics"
    spec:
      containers:
      - image: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0"
        livenessProbe:
          httpGet:
            path: "/livez"
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
        name: "kube-state-metrics"
        ports:
        - containerPort: 8080
          name: "http-metrics"
          protocol: "TCP"
        - containerPort: 8081
          name: "telemetry"
          protocol: "TCP"
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 5
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      serviceAccountName: "kube-state-metrics"
      tolerations:
      - effect: "NoSchedule"
        key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
