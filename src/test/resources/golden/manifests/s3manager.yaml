---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    app.kubernetes.io/name: "s3manager"
  name: "s3manager"
  namespace: "default"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "s3manager"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "s3manager"
    spec:
      containers:
      - env:
        - name: "USE_IAM"
          value: "true"
        - name: "ENDPOINT"
          value: "s3.us-west-2.amazonaws.com"
        - name: "REGION"
          value: "us-west-2"
        - name: "PORT"
          value: "8080"
        image: "cloudlena/s3manager:v0.5.0"
        livenessProbe:
          httpGet:
            path: "/"
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        name: "s3manager"
        ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: "TCP"
        readinessProbe:
          httpGet:
            path: "/"
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      dnsPolicy: "ClusterFirstWithHostNet"
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
      - effect: "NoSchedule"
        key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
