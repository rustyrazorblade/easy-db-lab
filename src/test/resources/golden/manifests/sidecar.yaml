---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  labels:
    app.kubernetes.io/name: "cassandra-sidecar"
  name: "cassandra-sidecar-config"
  namespace: "default"
data:
  cassandra-sidecar.yaml: |
    #
    # Licensed to the Apache Software Foundation (ASF) under one
    # or more contributor license agreements.  See the NOTICE file
    # distributed with this work for additional information
    # regarding copyright ownership.  The ASF licenses this file
    # to you under the Apache License, Version 2.0 (the
    # "License"); you may not use this file except in compliance
    # with the License.  You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    #

    #
    # Cassandra SideCar configuration template for K3s DaemonSet deployment.
    # __HOST_IP__ is substituted by the init container at pod startup using status.hostIP.
    #
    cassandra_instances:
      - id: 1
        host: __HOST_IP__
        port: 9042
        username: cassandra
        password: cassandra
        data_dirs:
          - /mnt/db1/cassandra/data/
        commitlog_dir: /mnt/db1/cassandra/commitlog
        hints_dir: /mnt/db1/cassandra/hints
        saved_caches_dir: /mnt/db1/cassandra/saved_caches
        staging_dir: /mnt/db1/cassandra/import
        jmx_host: 127.0.0.1
        jmx_port: 7199
        jmx_ssl_enabled: false

    sidecar:
      host: 0.0.0.0
      port: 9043
      dns_resolver: resolve_to_ip
      request_idle_timeout_millis: 300000
      request_timeout_millis: 300000
      tcp_keep_alive: false
      accept_backlog: 1024
      server_verticle_instances: 1
      throttle:
        stream_requests_per_sec: 5000
        delay_sec: 5
        timeout_sec: 10
      traffic_shaping:
        inbound_global_bandwidth_bps: 0
        outbound_global_bandwidth_bps: 0
        peak_outbound_global_bandwidth_bps: 419430400
        max_delay_to_wait_millis: 15000
        check_interval_for_stats_millis: 1000
        inbound_global_file_bandwidth_bps: 0
      sstable_upload:
        concurrent_upload_limit: 80
        min_free_space_percent: 10
      allowable_time_skew_in_minutes: 60
      sstable_import:
        poll_interval_millis: 5000
        cache:
          expire_after_access_millis: 7200000
          maximum_size: 10000
      worker_pools:
        service:
          name: "sidecar-worker-pool"
          size: 20
          max_execution_time_millis: 60000
        internal:
          name: "sidecar-internal-worker-pool"
          size: 20
          max_execution_time_millis: 900000
      jmx:
        max_retries: 3
        retry_delay_millis: 200
      schema:
        is_enabled: true
        keyspace: sidecar_internal
        replication_strategy: NetworkTopologyStrategy
        replication_factor: 3

    driver_parameters:
      contact_points:
        - "__HOST_IP__:9042"
      num_connections: 6

    healthcheck:
      initial_delay_millis: 0
      poll_freq_millis: 30000

    metrics:
      registry_name: cassandra_sidecar
      vertx:
        enabled: true
        expose_via_jmx: false
        jmx_domain_name: sidecar.vertx.jmx_domain
      include:
        - type: "regex"
          value: "sidecar.*"
        - type: "regex"
          value: "vertx.*"

    cassandra_input_validation:
      forbidden_keyspaces:
        - system_schema
        - system_traces
        - system_distributed
        - system
        - system_auth
        - system_views
        - system_virtual_schema
      allowed_chars_for_directory: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
      allowed_chars_for_quoted_name: "[a-zA-Z_0-9]{1,48}"
      allowed_chars_for_component_name: "[a-zA-Z0-9_-]+(.db|.cql|.json|.crc32|TOC.txt)"
      allowed_chars_for_restricted_component_name: "[a-zA-Z0-9_-]+(.db|TOC.txt)"

    blob_restore:
      job_discovery_active_loop_delay_millis: 10000
      job_discovery_idle_loop_delay_millis: 10000
      job_discovery_recency_days: 5
      slice_process_max_concurrency: 20
      restore_job_tables_ttl_seconds: 7776000

    s3_client:
      concurrency: 4
      thread_name_prefix: s3-client
      thread_keep_alive_seconds: 60
---
---
apiVersion: "apps/v1"
kind: "DaemonSet"
metadata:
  labels:
    app.kubernetes.io/name: "cassandra-sidecar"
  name: "cassandra-sidecar"
  namespace: "default"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "cassandra-sidecar"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cassandra-sidecar"
    spec:
      containers:
      - env:
        - name: "NODE_NAME"
          valueFrom:
            fieldRef:
              fieldPath: "spec.nodeName"
        - name: "JAVA_TOOL_OPTIONS"
          value: "-Dsidecar.config=file:///conf/sidecar.yaml -javaagent:/usr/local/pyroscope/pyroscope.jar\
            \ -Dpyroscope.application.name=cassandra-sidecar -Dpyroscope.server.address=http://10.0.0.1:4040\
            \ -Dpyroscope.labels=hostname=$(NODE_NAME),cluster=test-1 -Dpyroscope.tenant.id=tenant\
            \ -Dpyroscope.profiler.event=cpu -Dpyroscope.profiler.alloc=512k -Dpyroscope.profiler.lock=10ms\
            \ -Dpyroscope.ingest.max.tries=-1 -Dpyroscope.push.queue.capacity=360"
        - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
          value: "http://localhost:4317"
        - name: "OTEL_SERVICE_NAME"
          value: "cassandra-sidecar"
        image: "sidecar:test"
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: "/api/v1/cassandra/schema"
            port: 9043
          initialDelaySeconds: 60
          periodSeconds: 20
        name: "cassandra-sidecar"
        readinessProbe:
          httpGet:
            path: "/api/v1/cassandra/schema"
            port: 9043
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          runAsGroup: 999
          runAsUser: 999
        volumeMounts:
        - mountPath: "/conf"
          name: "config"
          readOnly: true
        - mountPath: "/mnt/db1/cassandra"
          name: "cassandra-data"
        - mountPath: "/usr/local/pyroscope"
          name: "pyroscope-agent"
          readOnly: true
      dnsPolicy: "ClusterFirstWithHostNet"
      hostNetwork: true
      initContainers:
      - args:
        - "sed \"s/__HOST_IP__/$HOST_IP/g\" /config-template/cassandra-sidecar.yaml\
          \ > /conf/sidecar.yaml"
        command:
        - "sh"
        - "-c"
        env:
        - name: "HOST_IP"
          valueFrom:
            fieldRef:
              fieldPath: "status.hostIP"
        image: "busybox:latest"
        name: "config-init"
        volumeMounts:
        - mountPath: "/config-template"
          name: "config-template"
          readOnly: true
        - mountPath: "/conf"
          name: "config"
      nodeSelector:
        type: "db"
      volumes:
      - configMap:
          name: "cassandra-sidecar-config"
        name: "config-template"
      - emptyDir: {}
        name: "config"
      - hostPath:
          path: "/mnt/db1/cassandra"
          type: "DirectoryOrCreate"
        name: "cassandra-data"
      - hostPath:
          path: "/usr/local/pyroscope"
          type: "Directory"
        name: "pyroscope-agent"
